<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#08080a" />
<title>PULSE // RED</title>
<link rel="apple-touch-icon" href="mainassets/icon.svg" />
<link rel="icon" href="mainassets/icon.svg" />
<style>
:root{
  --red:#ff1f3d;
  --red-soft:#ff5f74;
  --red-deep:#8c0f22;
  --bg:#07070a;
  --text:#eaeaee;
  --muted:#6a6a74;
  --line:rgba(255,31,61,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}

.screen{
  position:fixed;inset:0;opacity:0;pointer-events:none;
  transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
  will-change:opacity,transform;
}
.screen.active{opacity:1;pointer-events:auto;}

/* ============================== MENU ============================== */
#menu{background:#050507;}
#menuBg{
  position:absolute;inset:0;
  background-image:url('mainassets/IMG_2105.png');
  background-size:cover;background-position:center;
  background-color:#0a0407;
  transform:scale(1.06);
  filter:saturate(.75) contrast(1.08) brightness(.72);
  transition:filter 900ms cubic-bezier(.16,1,.3,1),transform 1400ms cubic-bezier(.16,1,.3,1);
}
#menu.soft-focus #menuBg{filter:saturate(.55) contrast(1.02) brightness(.62) blur(5px);transform:scale(1.09);}
#menu .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 15% 50%, rgba(255,31,61,.14) 0%, rgba(0,0,0,0) 55%),
    linear-gradient(90deg, rgba(5,5,8,.96) 0%, rgba(5,5,8,.72) 38%, rgba(5,5,8,.35) 62%, rgba(5,5,8,.85) 100%),
    linear-gradient(180deg, rgba(5,5,8,.7) 0%, rgba(5,5,8,0) 30%, rgba(5,5,8,.9) 100%);
}
#menu .grain{
  position:absolute;inset:0;opacity:.06;pointer-events:none;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 1px, transparent 1px 3px);
}
.menu-inner{
  position:absolute;inset:0;display:flex;align-items:center;
  padding:0 max(40px,6vw);
  transition:filter .7s ease,opacity .7s ease;
}
#menu.soft-focus .menu-inner{filter:blur(1px);opacity:.78;}
.title-block{max-width:640px;position:relative;}
.side-rule{
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--red),transparent);
  opacity:.7;
  margin-left:calc(-1 * max(20px,2.4vw));
}
.menu-icon{
  width:54px;height:54px;object-fit:contain;display:block;margin-bottom:22px;
  filter:drop-shadow(0 0 18px rgba(255,31,61,.55));
}
.menu-icon.hidden{display:none;}
.game-title{
  font-size:clamp(46px,8.6vw,124px);
  line-height:.86;font-weight:900;letter-spacing:-.045em;text-transform:uppercase;
  text-shadow:0 0 60px rgba(255,31,61,.35);
}
.game-title i{color:var(--red);font-style:normal;text-shadow:0 0 28px rgba(255,31,61,.9);}
.tagline{margin-top:22px;font-size:11px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;}
.play-btn{
  margin-top:44px;position:relative;overflow:hidden;
  border:1px solid rgba(255,31,61,.45);
  padding:19px 62px;font-size:14px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;
  transition:border-color .45s cubic-bezier(.16,1,.3,1), box-shadow .45s, transform .25s;
}
.play-btn span{position:relative;z-index:2;}
.play-btn::before{
  content:'';position:absolute;inset:0;background:var(--red);
  transform:translateX(-101%);
  transition:transform .5s cubic-bezier(.16,1,.3,1);
}
.play-btn:hover::before,.play-btn:active::before{transform:translateX(0);}
.play-btn:hover{border-color:var(--red);box-shadow:0 0 44px rgba(255,31,61,.4);}
.play-btn:active{transform:scale(.97);}

.eq{
  position:absolute;left:0;right:0;bottom:0;height:110px;
  display:flex;align-items:flex-end;gap:3px;opacity:.8;pointer-events:none;
  mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
}
.eq i{
  flex:1 1 0;height:2px;display:block;
  background:linear-gradient(to top, rgba(255,31,61,.95), rgba(255,31,61,.08));
  will-change:height;
}
.hint{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.42em;color:rgba(255,255,255,.4);
  text-transform:uppercase;transition:opacity .6s;pointer-events:none;
}
.hint.hidden{opacity:0;}

/* ============================== SONGS ============================== */
#songs{
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,31,61,.13) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#0a0508 0%, #07070a 45%, #050506 100%);
  display:flex;flex-direction:column;
}
#songs:not(.active){transform:translateX(5%);}
#menu:not(.active){transform:translateX(-3%) scale(.985);}
.songs-header{
  display:flex;align-items:center;gap:24px;
  padding:26px max(28px,4vw);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
  background:rgba(4,4,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.songs-header h2{
  font-size:13px;letter-spacing:.46em;text-transform:uppercase;font-weight:800;color:#fff;
}
.songs-header h2::after{content:' / choose a frequency to follow';color:rgba(255,255,255,.2);font-weight:500;letter-spacing:.18em;margin-left:12px;}
.ghost-btn{
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;
  color:var(--muted);border:1px solid rgba(255,255,255,.1);
  padding:11px 20px;transition:.3s;
}
.ghost-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.08);}
.ghost-btn.spacer{margin-left:auto;}
.song-list{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px max(28px,4vw) 80px;
  display:flex;flex-direction:column;gap:14px;
  touch-action:pan-y;
}
.song-list::-webkit-scrollbar{width:6px;}
.song-list::-webkit-scrollbar-thumb{background:rgba(255,31,61,.35);border-radius:3px;}

.card{
  position:relative;height:128px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(105deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  display:flex;align-items:center;
  padding:0 28px;overflow:hidden;cursor:pointer;
  transition:border-color .35s, background .35s, transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
}
.card:hover,.card.previewing{
  border-color:rgba(255,31,61,.6);
  background:linear-gradient(90deg, rgba(255,31,61,.11), rgba(255,31,61,.015));
  transform:translateX(10px) rotateX(1deg);
  box-shadow:0 0 40px rgba(255,31,61,.12), inset 0 0 60px rgba(255,31,61,.05);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);transform:scaleY(0);transform-origin:center;transition:transform .35s cubic-bezier(.16,1,.3,1);}
.card:hover::before,.card.previewing::before{transform:scaleY(1);}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,31,61,.07) 48%,transparent 100%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.16,1,.3,1);pointer-events:none;}
.card:hover::after,.card.previewing::after{transform:translateX(120%);}
.track-no{position:relative;z-index:2;width:34px;margin-right:18px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.24);font-variant-numeric:tabular-nums;}
.card-info{position:relative;z-index:2;max-width:55%;min-width:0;}
.card-title{
  font-size:clamp(15px,2.1vw,21px);font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 20px rgba(0,0,0,.9);
}
.card-meta{
  margin-top:8px;font-size:10px;letter-spacing:.18em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-diff{
  position:relative;z-index:2;margin-left:auto;
  font-size:11px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;
  padding:9px 18px;border:1px solid rgba(255,255,255,.14);color:var(--muted);
  transition:.3s;flex:0 0 auto;
}
.card-diff.d-easy{color:#9a9aa4;border-color:rgba(255,255,255,.2);}
.card-diff.d-normal{color:var(--red-soft);border-color:rgba(255,95,116,.5);}
.card-diff.d-hard{color:var(--red);border-color:rgba(255,31,61,.6);box-shadow:0 0 22px rgba(255,31,61,.2);}
.card-diff.d-extreme{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 0 30px rgba(255,31,61,.6);}

.vinyl{
  position:absolute;left:50%;top:50%;width:104px;height:104px;
  margin:-52px 0 0 -52px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%, #191920 0 2px, #0b0b0f 2px 4px),#0d0d11;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 10px 40px rgba(0,0,0,.9);
  opacity:.22;z-index:1;transition:opacity .45s ease, box-shadow .45s ease;
}
.vinyl::after{
  content:'';position:absolute;inset:31%;border-radius:50%;
  background:radial-gradient(circle, var(--red) 0 38%, #64091a 39% 100%);
  box-shadow:0 0 16px rgba(255,31,61,.55);
}
.vinyl::before{
  content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#07070a;z-index:3;
}
.card:hover .vinyl,.card.previewing .vinyl{
  opacity:.95;animation:spin 1.7s linear infinite;
  box-shadow:inset 0 0 0 1px rgba(255,31,61,.55), 0 0 46px rgba(255,31,61,.45);
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.empty-note{
  padding:60px 4px;color:var(--muted);font-size:12px;letter-spacing:.28em;text-transform:uppercase;line-height:2.2;
}

/* ============================== GAME ============================== */
#game{background:#050506;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.game-hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:max(18px,3vh) max(22px,3vw);
  pointer-events:none;
  z-index:10;
}
.gh-title{
  font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);font-weight:700;
  max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.gh-bpm{
  font-size:9px;letter-spacing:.3em;color:rgba(255,255,255,.28);
  margin-top:6px;font-variant-numeric:tabular-nums;
}
.health{
  margin-top:10px;width:min(220px,32vw);height:2px;background:rgba(255,255,255,.06);
  overflow:hidden;
}
.health-fill{
  height:100%;width:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));
  transition:width .18s linear, background .4s;
  box-shadow:0 0 12px rgba(255,31,61,.7);
}
.health.low .health-fill{background:linear-gradient(90deg,#ff1f3d,#ff6b3d);}
.gh-right{display:flex;align-items:center;gap:22px;pointer-events:auto;}
.gh-score{
  font-size:clamp(18px,2.6vw,26px);font-weight:900;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.75);
}
.gh-quit{
  pointer-events:auto;width:36px;height:36px;border:1px solid rgba(255,255,255,.1);
  color:var(--muted);font-size:14px;transition:.3s;line-height:1;
}
.gh-quit:hover{border-color:var(--red);color:#fff;background:rgba(255,31,61,.12);}

.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,6,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  z-index:20;
}
.overlay.show{opacity:1;pointer-events:auto;}
.result-panel{
  width:min(560px,88vw);border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,31,61,.06), rgba(0,0,0,0));
  padding:44px 44px 36px;text-align:center;
}
.result-grade{
  font-size:clamp(64px,12vw,110px);font-weight:900;line-height:1;letter-spacing:-.04em;
  color:var(--red);text-shadow:0 0 60px rgba(255,31,61,.75);
}
.result-title{margin-top:8px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);}
.result-track{
  margin-top:26px;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.result-score{margin-top:18px;font-size:clamp(30px,5vw,44px);font-weight:900;font-variant-numeric:tabular-nums;}
.result-grid{
  margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  border-top:1px solid var(--line);padding-top:24px;
}
.result-grid div span{display:block;font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;}
.result-grid div b{display:block;margin-top:8px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
.result-actions{margin-top:34px;display:flex;gap:14px;justify-content:center;}
.act-btn{
  border:1px solid rgba(255,255,255,.14);padding:15px 34px;
  font-size:11px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
  transition:.3s;color:var(--muted);
}
.act-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.14);}
.act-btn.primary{border-color:var(--red);color:#fff;background:rgba(255,31,61,.16);}
.act-btn.primary:hover{background:var(--red);}

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.75) .5px,transparent .7px);
  background-size:5px 5px;mix-blend-mode:screen;
}

@media (max-width:700px){
  .songs-header h2::after{display:none;}
  .card{height:112px;padding:0 18px;}
  .card-diff{padding:7px 10px;font-size:9px;letter-spacing:.16em;}
}
</style>
</head>
<body>

<!-- ========================= MAIN MENU ========================= -->
<section id="menu" class="screen active">
  <div id="menuBg"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div class="menu-inner">
    <div class="title-block">
      <div class="side-rule"></div>
      <img id="menuIcon" class="menu-icon" src="mainassets/icon.svg" alt="" />
      <h1 class="game-title">PULSE<br><i>//</i>RED</h1>
      <p class="tagline">Rhythm Reactor &nbsp;·&nbsp; v4.0</p>
      <button id="playBtn" class="play-btn"><span>Play</span></button>
    </div>
  </div>
  <div class="eq" id="eq"></div>
  <div class="hint" id="tapHint">Tap anywhere to enable audio</div>
</section>

<!-- ========================= SONG SELECT ========================= -->
<section id="songs" class="screen">
  <header class="songs-header">
    <button id="backBtn" class="ghost-btn">← Back</button>
    <h2>Select Track</h2>
    <button id="importBtn" class="ghost-btn spacer">Import</button>
    <input type="file" id="fileInput" accept="audio/*" multiple hidden />
  </header>
  <div class="song-list" id="songList"></div>
</section>

<!-- ========================= GAME ========================= -->
<section id="game" class="screen">
  <canvas id="cv"></canvas>
  <div class="game-hud">
    <div>
      <div class="gh-title" id="ghTitle">—</div>
      <div class="gh-bpm" id="ghBpm"></div>
      <div class="health" id="healthWrap"><div class="health-fill" id="healthFill"></div></div>
    </div>
    <div class="gh-right">
      <div class="gh-score" id="ghScore">0</div>
      <button class="gh-quit" id="quitBtn">✕</button>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="result-panel">
      <div class="result-grade" id="resGrade">S</div>
      <div class="result-title" id="resVerdict">Cleared</div>
      <div class="result-track" id="resTrack">—</div>
      <div class="result-score" id="resScore">0</div>
      <div class="result-grid">
        <div><span>Perfect</span><b id="resPerfect">0</b></div>
        <div><span>Good</span><b id="resGood">0</b></div>
        <div><span>Miss</span><b id="resMiss">0</b></div>
        <div><span>Max Combo</span><b id="resCombo">0</b></div>
      </div>
      <div class="result-actions">
        <button class="act-btn" id="resBack">Tracks</button>
        <button class="act-btn primary" id="resRetry">Retry</button>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const AUDIO_RE = /\.(mp3|m4a|aac|ogg|oga|wav|flac)$/i;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = s => {
  if (!isFinite(s) || s <= 0) return '--:--';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
};

/* ---------- audio context ---------- */
let AC = null;
function actx() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AC = new Ctx();
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function fadeAudio(a, to, ms) {
  if (!a) return;
  if (a._fadeRaf) cancelAnimationFrame(a._fadeRaf);
  const from = a.volume, start = performance.now();
  const step = () => {
    const k = clamp((performance.now() - start) / ms, 0, 1);
    try { a.volume = clamp(from + (to - from) * k, 0, 1); } catch (e) {}
    if (k < 1) a._fadeRaf = requestAnimationFrame(step);
    else a._fadeRaf = 0;
  };
  a._fadeRaf = requestAnimationFrame(step);
}

/* ---------- folder scanning ---------- */
const ASSET_FALLBACKS = {
  'mainassets/': ['Y2Mate.is - Third Rail.mp3'],
  'music/': [
    'Y2Mate.is - MV ABM -  Signaling   .mp3',
    'Y2Mate.is - Rose feat Ember Amane.mp3'
  ]
};
function assetUrl(dir, name) { return dir + encodeURIComponent(String(name)); }
async function probe(url) {
  try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.ok; }
  catch (e) { return false; }
}
async function listDir(dir) {
  try {
    const r = await fetch(dir + 'manifest.json', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j && j.files) || [];
      const out = arr.map(f => (typeof f === 'string' ? f : (f && (f.file || f.name)) || '')).filter(f => AUDIO_RE.test(f));
      if (out.length) return Array.from(new Set(out));
    }
  } catch (e) {}
  try {
    const r = await fetch(dir, { cache: 'no-store' });
    if (r.ok) {
      const txt = await r.text();
      const names = [];
      const re = /href\s*=\s*["']([^"']+)["']/gi;
      let m;
      while ((m = re.exec(txt))) {
        let h = m[1];
        if (/^(https?:)?\/\//i.test(h) || h[0] === '?' || h[0] === '#') continue;
        h = h.split('?')[0].split('#')[0];
        const name = decodeURIComponent(h.replace(/\/+$/, '').split('/').pop());
        if (AUDIO_RE.test(name)) names.push(name);
      }
      const uniq = Array.from(new Set(names));
      if (uniq.length) return uniq;
    }
  } catch (e) {}
  return (ASSET_FALLBACKS[dir] || []).filter(Boolean);
}

/* ============================================================
   MENU MUSIC
   ============================================================ */
let titleAudio = null, titleAnalyser = null, titleFilter = null, titleGain = null;
const eqBars = [];
const TITLE_VOL = 0.42;
let titleWanted = true;
let titleHoverMute = false;

function buildEq() {
  const eq = $('#eq');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 58; i++) {
    const b = document.createElement('i');
    frag.appendChild(b);
    eqBars.push(b);
  }
  eq.appendChild(frag);
}

async function initTitleMusic() {
  let url = null;
  const files = await listDir('mainassets/');
  if (files.length) url = assetUrl('mainassets/', files[0]);
  else {
    const candidates = ['theme.mp3','title.mp3','menu.mp3','main.mp3','music.mp3','bgm.mp3','bg.mp3','soundtrack.mp3'];
    for (const c of candidates) {
      if (await probe(assetUrl('mainassets/', c))) { url = assetUrl('mainassets/', c); break; }
    }

      const duration = await getAudioDuration(song.url);
      if (duration > 0) {
        song.chart = fallbackChart(duration, song.id.length * 997 + song.title.length * 31);
        song.duration = song.chart.duration;
        song.difficulty = song.chart.difficulty;
        song.noteCount = song.chart.notes.length;
        song.density = song.chart.density;
        song.bpm = song.chart.bpm;
        song.status = 'ready';
      } else {
        song.status = 'error';
      }
    }
    song.buffer = null;
    updateCard(song);
    return song;
  })();
  return song.promise;
}
async function analyzeQueue() {
  if (analyzing) return;
  analyzing = true;
  for (const s of songs) {
    if (s.status === 'pending') {
      await ensureAnalysis(s);
      await new Promise(r => setTimeout(r, 40));
    }
  }
  analyzing = false;
}
function updateCard(s) {
  if (!s.el) return;
  const meta = s.el.querySelector('[data-meta]');
  const diff = s.el.querySelector('[data-diff]');
  if (s.status === 'ready') {
    meta.textContent = `${fmtTime(s.duration)} · ${s.noteCount} NOTES · ${Math.round(s.bpm || 0)} BPM`;
    diff.textContent = s.difficulty;
    diff.className = 'card-diff d-' + s.difficulty.toLowerCase();
  } else if (s.status === 'analyzing') {
    meta.textContent = 'ANALYZING WAVEFORM…';
    diff.textContent = '—';
    diff.className = 'card-diff';
  } else if (s.status === 'error') {
    meta.textContent = 'UNAVAILABLE';
    diff.textContent = '—';
    diff.className = 'card-diff';
  } else {
    meta.textContent = 'QUEUED';
    diff.textContent = '—';
    diff.className = 'card-diff';
  }
}

let previewAudio = null, previewCard = null;
function playPreview(song, el) {
  if (previewCard === el) return;
  stopPreview();
  previewCard = el;
  el.classList.add('previewing');
  titleHoverMute = true;
  if (titleAudio) setTitleSoundState('hover');
  try {
    previewAudio = new Audio(song.url);
    previewAudio.volume = 0;
    previewAudio.addEventListener('loadedmetadata', () => {
      try {
        const d = previewAudio.duration;
        if (isFinite(d) && d > 8) previewAudio.currentTime = Math.min(d * 0.22, 32);
      } catch (e) {}
    });
    previewAudio.play().then(() => fadeAudio(previewAudio, 0.5, 450)).catch(() => {});
  } catch (e) {}
}
function stopPreview() {
  if (previewAudio) {
    try { previewAudio.pause(); } catch (e) {}
    previewAudio.src = '';
    previewAudio = null;
  }
  if (previewCard) { previewCard.classList.remove('previewing'); previewCard = null; }
  titleHoverMute = false;
  if (titleAudio && !titleAudio.paused) setTitleSoundState(titleWanted ? 'title' : 'away');
}
let touchPreviewId = null;
let suppressClick = false;
function renderSongs() {
  const list = $('#songList');
  list.innerHTML = '';
  if (!songs.length) {
    const d = document.createElement('div');
    d.className = 'empty-note';
    d.textContent = 'No tracks found. Add audio files to /music or update music/manifest.json.';
    list.appendChild(d);
    return;
  }
  songs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="track-no">' + String(songs.indexOf(s) + 1).padStart(2, '0') + '</div>' +
      '<div class="vinyl"></div>' +
      '<div class="card-info">' +
        '<div class="card-title">' + esc(s.title) + '</div>' +
        '<div class="card-meta" data-meta>QUEUED</div>' +
      '</div>' +
      '<div class="card-diff" data-diff>—</div>';
    el.addEventListener('pointerenter', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      playPreview(s, el);
    });
    el.addEventListener('pointerleave', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopPreview();
    });
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      if (touchPreviewId !== s.id) {
        touchPreviewId = s.id;
        playPreview(s, el);
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 450);
      }
    });
    el.addEventListener('click', () => {
      if (suppressClick) return;
      startGame(s);
    });
    list.appendChild(el);
    s.el = el;
    updateCard(s);
  });
}

function showScreen(id) {
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  titleWanted = (id === 'menu');
  titleHoverMute = false;
  $('#menu').classList.toggle('soft-focus', id !== 'menu');
  if (titleAudio) {
    setTitleSoundState(id === 'menu' ? 'title' : (id === 'songs' ? 'away' : 'game'));
    if (id === 'game') { try { titleAudio.pause(); } catch(e) {} }
    else if (titleAudio.paused) titleAudio.play().catch(() => {});
  }
  if (id === 'menu') setTimeout(resizeCanvas, 30);
}

/* ============================================================
   GAME — SINGLE LANE
   ============================================================
   Notes fall down a single centered vertical lane.

     • TAP notes   → tap the pad (or anywhere in the lower zone)
     • SWIPE notes → swipe left / right starting from the pad

   Camera (canvas transform) reacts to music (bass-driven zoom,
   kick-driven shake, beat-driven drift).
   Streak number uses spring physics with per-hit kick.
   ============================================================ */
const cv = $('#cv');
const ctx = cv.getContext('2d', { alpha: false });

const AUDIO_OFFSET = 0.015;   // browser audio pipeline compensation

// Timing windows
const PERFECT = 0.048;
const GREAT   = 0.090;
const GOOD    = 0.140;

// Swipe gesture detection
const SWIPE_MIN_DIST = 34;    // px
const SWIPE_MAX_TIME = 340;   // ms

const game = {
  running: false,
  song: null,
  audio: null,
  notes: [],
  approach: 1.55,
  missWindow: 0.18,
  score: 0,
  combo: 0,
  maxCombo: 0,
  health: 100,
  perfect: 0,
  great: 0,
  good: 0,
  miss: 0,
  particles: [],
  popups: [],
  // gameplay space
  W: 0, H: 0,
  laneW: 260,
  laneX: 0,
  padTop: 0,
  hitY: 0,
  // timing
  startCtxTime: 0,
  startAudioTime: 0,
  introEnd: 0,
  // audio-reactive
  audioCtx: null,
  analyser: null,
  freq: null,
  bass: 0, mid: 0, hi: 0,
  // gesture tracking
  pointers: new Map(),
  // visual
  padFlash: 0,
  hitFlash: 0,
  failed: false,
  finished: false,
  raf: 0,
  lastFrame: 0,
  // camera
  cam: {
    zoom: 1, targetZoom: 1,
    shakeX: 0, shakeY: 0, shakeMag: 0,
    driftX: 0, driftY: 0,
    rot: 0, targetRot: 0
  },
  // streak physics
  streak: {
    scale: 1, scaleVel: 0,
    y: 0, yVel: 0,
    glow: 0,
    alpha: 0
  },
  // beat ripple from kicks
  ripples: [],
  lastKickAt: 0
};

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  game.W = w;
  game.H = h;
  game.laneW = Math.min(w * 0.42, 320);
  game.laneX = w / 2;
  const padH = Math.max(120, Math.min(200, h * 0.22));
  game.padTop = h - padH;
  game.hitY = game.padTop;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 240));

function gameTime() {
  if (!game.audioCtx) return 0;
  return (game.audioCtx.currentTime - game.startCtxTime) + game.startAudioTime - AUDIO_OFFSET;
}

/* Note world Y: from above the screen down to hit line */
function noteY(note, t) {
  const dt = note.t - t;
  const p = 1 - dt / game.approach;
  const spawnY = -80;
  return spawnY + (game.hitY - spawnY) * p;
}

/* ---------- physics-driven streak ---------- */
function kickStreak(newCombo) {
  game.combo = newCombo;
  game.streak.scaleVel += 0.55;   // bounce up
  game.streak.yVel -= 90;          // push up
  game.streak.glow = 1;
  if (newCombo > game.maxCombo) game.maxCombo = newCombo;
}
function updateStreakPhysics(dt) {
  const s = game.streak;
  // spring scale back to 1
  const sk = 0.34, sd = 0.68;
  s.scaleVel += (1 - s.scale) * sk;
  s.scaleVel *= sd;
  s.scale += s.scaleVel;

  // vertical spring
  const yk = 0.28, yd = 0.70;
  s.yVel += (0 - s.y) * yk;
  s.yVel *= yd;
  s.y += s.yVel;

  s.glow *= 0.90;

  const targetAlpha = game.combo >= 2 ? 1 : 0;
  s.alpha += (targetAlpha - s.alpha) * Math.min(1, dt * 9);
}
function breakStreak() {
  game.combo = 0;
  game.streak.scaleVel -= 0.4;
}

/* ---------- camera ---------- */
function kickShake(mag) {
  game.cam.shakeMag = Math.max(game.cam.shakeMag, mag);
}
function updateCamera(dt) {
  const c = game.cam;
  // Zoom spring toward target (bass drives target)
  c.targetZoom = 1 + game.bass * 0.035;
  c.zoom += (c.targetZoom - c.zoom) * Math.min(1, dt * 14);

  // Shake decay
  c.shakeMag *= Math.pow(0.0025, dt); // frame-rate independent decay
  if (c.shakeMag < 0.02) c.shakeMag = 0;
  c.shakeX = (Math.random() - 0.5) * 2 * c.shakeMag;
  c.shakeY = (Math.random() - 0.5) * 2 * c.shakeMag;

  // Subtle rotation wobble from mid energy
  c.targetRot = (game.mid - 0.3) * 0.006;
  c.rot += (c.targetRot - c.rot) * Math.min(1, dt * 6);
}

/* ---------- particles / popups ---------- */
function spawnParticles(x, y, color, energy) {
  const n = Math.round(12 + energy * 18);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 340 * (0.5 + energy);
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 80,
      r: 1.5 + Math.random() * 3,
      life: 0.5 + Math.random() * 0.4,
      color
    });
  }
}
function pushPopup(x, y, text, color, life = 0.75, size = 15) {
  game.popups.push({ x, y, text, color, life, maxLife: life, size });
}

/* ---------- scoring ---------- */
function resolveHit(note, tapTime) {
  const dt = Math.abs(note.t - tapTime);
  let label, gain, color, particleColor;
  if (dt <= PERFECT)      { label = 'PERFECT'; gain = 320; game.perfect++; game.health = clamp(game.health + 2.2, 0, 100); color = '#ffffff'; particleColor = '#ffffff'; }
  else if (dt <= GREAT)   { label = 'GREAT';   gain = 220; game.great++;   game.health = clamp(game.health + 1.5, 0, 100); color = '#ffd7dd'; particleColor = '#ffd7dd'; }
  else if (dt <= GOOD)    { label = 'GOOD';    gain = 120; game.good++;    game.health = clamp(game.health + 0.8, 0, 100); color = '#ff8a9b'; particleColor = '#ff5f74'; }
  else                    { label = 'GOOD';    gain = 60;  game.good++;    game.health = clamp(game.health + 0.3, 0, 100); color = '#ff8a9b'; particleColor = '#ff5f74'; }

  note.hit = true;
  note.resolved = true;

  kickStreak(game.combo + 1);
  const mult = 1 + Math.min(game.combo, 150) / 150 * 0.7;
  game.score += Math.round(gain * mult);

  const x = game.laneX;
  const y = game.hitY;
  spawnParticles(x, y, particleColor, note.energy);
  pushPopup(x, y - 46, label, color, 0.75, dt <= PERFECT ? 17 : 15);

  game.hitFlash = 1;
  if (dt <= PERFECT) kickShake(7);
  else if (dt <= GREAT) kickShake(3.5);
  else kickShake(1.5);

  updateHud();
}
function onMiss(note) {
  game.miss++;
  breakStreak();
  game.health = clamp(game.health - 8.5, 0, 100);
  pushPopup(game.laneX, game.hitY - 46, 'MISS', '#7a0c1e', 0.6, 14);
  updateHud();
  if (game.health <= 0 && !game.failed) {
    game.failed = true;
    finishGame();
  }
}

/* ---------- input ----------
   Pointer in the pad zone (bottom ~22%):
     - If a tap note is in window → resolve immediately with pointerdown time
     - If a swipe note is in window → begin tracking; confirm when move matches direction
       (hit time still measured from pointerdown — the moment of contact)
*/
function findCandidateNote(tapTime) {
  let best = null, bestDt = Infinity;
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed || n.resolved) continue;
    const dt = Math.abs(n.t - tapTime);
    if (dt > game.missWindow) continue;
    if (dt < bestDt) { bestDt = dt; best = n; }
    if (n.t - tapTime > game.missWindow + 0.1) break;
  }
  return best;
}

function onPointerDown(e) {
  if (!game.running || game.finished) return;
  const rect = cv.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const x = e.clientX - rect.left;
  const t = gameTime();
  if (t < game.introEnd) return;

  // Only register taps in the pad zone
  if (y < game.padTop - 30) return;

  // Any horizontal position counts — but show a ripple at the touch point
  game.padFlash = Math.max(game.padFlash, 0.85);

  const note = findCandidateNote(t);
  if (!note) {
    game.health = clamp(game.health - 0.3, 0, 100);
    updateHud();
    return;
  }

  if (note.type === 'tap') {
    resolveHit(note, t);
  } else {
    // Begin swipe tracking
    note.resolved = true; // reserve the note
    game.pointers.set(e.pointerId, {
      startX: x, startY: y, startTime: performance.now(),
      note, tapTime: t, confirmed: false
    });
  }
}

function onPointerMove(e) {
  const p = game.pointers.get(e.pointerId);
  if (!p || p.confirmed) return;
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const dx = x - p.startX;
  const dy = y - p.startY;
  const elapsed = performance.now() - p.startTime;
  if (elapsed > SWIPE_MAX_TIME) return;

  const distX = Math.abs(dx);
  const distY = Math.abs(dy);
  if (distX < SWIPE_MIN_DIST) return;
  // Require a mostly horizontal gesture
  if (distY > distX * 0.8) return;

  // Direction: 1 = right, -1 = left (screen coords, dx>0 is right)
  const actualDir = dx > 0 ? 1 : -1;
  if (actualDir !== p.note.dir) return;   // wrong direction — keep waiting

  // Confirmed!
  p.confirmed = true;
  resolveHit(p.note, p.tapTime);
  game.pointers.delete(e.pointerId);
}

function onPointerUp(e) {
  const p = game.pointers.get(e.pointerId);
  if (!p) return;
  game.pointers.delete(e.pointerId);
  if (!p.confirmed) {
    if (!p.note.hit && !p.note.missed) {
      p.note.missed = true;
      onMiss(p.note);
    }
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
cv.addEventListener('pointermove', onPointerMove, { passive: true });
cv.addEventListener('pointerup', onPointerUp);
cv.addEventListener('pointercancel', onPointerUp);

/* Keyboard fallback: SPACE/any key = tap, ←/→ = swipe */
window.addEventListener('keydown', e => {
  if (!game.running || game.finished) return;
  if (e.repeat) return;
  const t = gameTime();
  if (t < game.introEnd) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const wantDir = k === 'ArrowRight' ? 1 : -1;
    for (let i = 0; i < game.notes.length; i++) {
      const n = game.notes[i];
      if (n.hit || n.missed || n.resolved) continue;
      if (n.type !== 'swipe' || n.dir !== wantDir) continue;
      if (Math.abs(n.t - t) <= game.missWindow) { resolveHit(n, t); break; }
      if (n.t - t > game.missWindow + 0.1) break;
    }
  } else if (k === ' ' || k === 'Spacebar') {
    const n = findCandidateNote(t);
    if (n && n.type === 'tap') resolveHit(n, t);
  }
});

/* ---------- HUD ---------- */
function updateHud() {
  $('#ghScore').textContent = game.score.toLocaleString();
  $('#healthFill').style.width = game.health.toFixed(1) + '%';
  $('#healthWrap').classList.toggle('low', game.health < 35);
}

/* ---------- loop ---------- */
function gameLoop() {
  if (!game.running) return;
  const now = performance.now();
  let dt = (now - game.lastFrame) / 1000;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  if (dt > 0.05) dt = 0.05;   // cap
  game.lastFrame = now;

  const t = gameTime();

  // Miss detection
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed) continue;
    if (n.resolved && !n.hit) {
      // Swipe note was reserved but not confirmed — check if tracking expired
      let tracked = false;
      for (const p of game.pointers.values()) if (p.note === n) { tracked = true; break; }
      if (!tracked && t > n.t + game.missWindow + 0.06) {
        n.missed = true;
        onMiss(n);
      }
      continue;
    }
    if (n.t - t > game.approach + 0.5) break;
    if (t > n.t + game.missWindow) {
      n.missed = true;
      onMiss(n);
    }
  }

  // Audio analysis
  if (game.analyser && game.freq) {
    game.analyser.getByteFrequencyData(game.freq);
    let lo = 0, mi = 0, hi = 0, lc = 0, mc = 0, hc = 0;
    for (let i = 0; i < game.freq.length; i++) {
      const v = game.freq[i] / 255;
      if (i < 8) { lo += v; lc++; }
      else if (i < 40) { mi += v; mc++; }
      else { hi += v; hc++; }
    }
    game.bass = lo / Math.max(1, lc);
    game.mid = mi / Math.max(1, mc);
    game.hi = hi / Math.max(1, hc);
  } else {
    const s = now / 1000;
    game.bass = 0.5 + 0.35 * Math.sin(s * Math.PI * 2 / 0.45);
    game.mid = 0.4;
    game.hi = 0.3;
  }

  // Kick ripple spawn
  if (game.bass > 0.55 && now - game.lastKickAt > 240) {
    game.lastKickAt = now;
    game.ripples.push({ born: now, dur: 1.5, strength: game.bass });
  }

  updateCamera(dt);
  updateStreakPhysics(dt);
  game.padFlash *= Math.pow(0.0004, dt);
  game.hitFlash *= Math.pow(0.0008, dt);
  if (game.padFlash < 0.01) game.padFlash = 0;
  if (game.hitFlash < 0.01) game.hitFlash = 0;

  drawGame(t, now, dt);
  game.raf = requestAnimationFrame(gameLoop);
}

/* ---------- rendering ---------- */
function drawGame(t, now, dt) {
  const W = game.W, H = game.H;
  const c = game.cam;

  // ---- Camera transform ----
  ctx.save();
  // Apply zoom around the pad / play focus
  const focusX = W / 2;
  const focusY = game.hitY;
  ctx.translate(focusX + c.shakeX, focusY + c.shakeY);
  ctx.rotate(c.rot);
  ctx.scale(c.zoom, c.zoom);
  ctx.translate(-focusX, -focusY);

  // ---- Background ----
  // Deep base gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#060509');
  bg.addColorStop(0.6, '#050408');
  bg.addColorStop(1, '#0a0508');
  ctx.fillStyle = bg;
  ctx.fillRect(-100, -100, W + 200, H + 200);

  // Bass-driven glow behind the lane
  const bgGlow = ctx.createRadialGradient(game.laneX, game.hitY - 100, 0, game.laneX, game.hitY - 100, W * 0.9);
  bgGlow.addColorStop(0, `rgba(255,31,61,${0.06 + game.bass * 0.16})`);
  bgGlow.addColorStop(0.5, `rgba(255,31,61,${0.02 + game.bass * 0.05})`);
  bgGlow.addColorStop(1, 'rgba(255,31,61,0)');
  ctx.fillStyle = bgGlow;
  ctx.fillRect(-100, -100, W + 200, H + 200);

  // ---- Floating ambient motes (very subtle) ----
  ctx.save();
  ctx.globalAlpha = 0.2 + game.hi * 0.3;
  for (let i = 0; i < 26; i++) {
    const seed = i * 137.13;
    const px = ((Math.sin(seed) * 0.5 + 0.5) * W);
    const py = ((now * 0.00003 * (1 + (i % 3)) + (i / 26)) % 1) * H;
    const r = 0.6 + (i % 3) * 0.4;
    ctx.beginPath();
    ctx.arc(px, H - py, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.15 + game.hi * 0.2})`;
    ctx.fill();
  }
  ctx.restore();

  // ---- Beat ripples from center of lane ----
  for (let i = game.ripples.length - 1; i >= 0; i--) {
    const r = game.ripples[i];
    const age = (now - r.born) / 1000;
    const life = 1 - age / r.dur;
    if (life <= 0) { game.ripples.splice(i, 1); continue; }
    const rad = 30 + (game.hitY - 30) * (age / r.dur);
    ctx.beginPath();
    ctx.arc(game.laneX, game.hitY, rad, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,31,61,${0.28 * life * r.strength})`;
    ctx.lineWidth = 1.4 * life;
    ctx.stroke();
  }

  // ---- Lane rails (thin vertical lines) ----
  const lw = game.laneW;
  ctx.strokeStyle = `rgba(255,255,255,${0.06 + game.bass * 0.05})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(game.laneX - lw / 2, 0);
  ctx.lineTo(game.laneX - lw / 2, game.hitY);
  ctx.moveTo(game.laneX + lw / 2, 0);
  ctx.lineTo(game.laneX + lw / 2, game.hitY);
  ctx.stroke();

  // Faint center hint
  ctx.strokeStyle = `rgba(255,255,255,0.025)`;
  ctx.beginPath();
  ctx.moveTo(game.laneX, 0);
  ctx.lineTo(game.laneX, game.hitY);
  ctx.stroke();

  // ---- Hit line ----
  const hitPulse = 0.5 + game.bass * 0.5 + game.hitFlash;
  ctx.beginPath();
  ctx.moveTo(game.laneX - lw / 2 - 20, game.hitY);
  ctx.lineTo(game.laneX + lw / 2 + 20, game.hitY);
  ctx.strokeStyle = `rgba(255,255,255,${0.28 + Math.min(0.55, hitPulse * 0.35)})`;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Hit line glow
  const hlg = ctx.createLinearGradient(0, game.hitY - 20, 0, game.hitY + 20);
  hlg.addColorStop(0, 'rgba(255,31,61,0)');
  hlg.addColorStop(0.5, `rgba(255,31,61,${0.2 + game.hitFlash * 0.5})`);
  hlg.addColorStop(1, 'rgba(255,31,61,0)');
  ctx.fillStyle = hlg;
  ctx.fillRect(game.laneX - lw / 2 - 30, game.hitY - 20, lw + 60, 40);

  // ---- Pad (touch zone) ----
  const padTop = game.padTop;
  const padH = H - padTop;
  // Pad base
  ctx.fillStyle = `rgba(255,255,255,${0.008 + game.padFlash * 0.025})`;
  ctx.fillRect(game.laneX - lw / 2 - 12, padTop, lw + 24, padH);
  // Pad glow
  if (game.padFlash > 0.01) {
    const pg = ctx.createRadialGradient(game.laneX, padTop + padH * 0.5, 0, game.laneX, padTop + padH * 0.5, lw * 1.4);
    pg.addColorStop(0, `rgba(255,31,61,${game.padFlash * 0.35})`);
    pg.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(game.laneX - lw * 1.5, padTop - 30, lw * 3, padH + 30);
  }
  // Pad top border (redundant with hit line, but thickens it in pad zone)
  ctx.beginPath();
  ctx.moveTo(game.laneX - lw / 2 - 8, padTop);
  ctx.lineTo(game.laneX + lw / 2 + 8, padTop);
  ctx.strokeStyle = `rgba(255,255,255,${0.12 + game.padFlash * 0.4})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Hint text inside pad
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(255,255,255,${0.10 + game.padFlash * 0.3})`;
  ctx.font = '600 10px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText('TAP · SWIPE', game.laneX, padTop + padH * 0.55);
  ctx.restore();

  // ---- Notes ----
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed) continue;
    const dt2 = n.t - t;
    if (dt2 > game.approach) continue;
    if (dt2 < -game.missWindow - 0.3) continue;
    drawNote(n, t);
  }

  // ---- Particles ----
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 900 * dt;
    p.vx *= Math.pow(0.05, dt);
    p.life -= dt * 1.8;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * clamp(p.life, 0, 1), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- Popups (PERFECT / GOOD / MISS) ----
  ctx.textAlign = 'center';
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.life -= dt;
    if (p.life <= 0) { game.popups.splice(i, 1); continue; }
    const k = 1 - p.life / p.maxLife; // 0 → 1
    const y = p.y - k * 34;
    const alpha = p.life < 0.2 ? p.life / 0.2 : Math.min(1, k * 6 + 0.3);
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.fillStyle = p.color;
    ctx.font = `800 ${p.size}px -apple-system,Helvetica,Arial,sans-serif`;
    ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;

  // ---- Streak (spring physics) ----
  const s = game.streak;
  if (s.alpha > 0.01 && game.combo > 0) {
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.translate(W / 2, H * 0.30 + s.y);
    const scale = s.scale;
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // glow layer
    ctx.shadowColor = `rgba(255,31,61,${0.7 + s.glow * 0.3})`;
    ctx.shadowBlur = 26 + s.glow * 30;

    // number
    const numSize = Math.round(Math.min(W, H) * 0.16);
    ctx.font = `900 ${numSize}px -apple-system,Helvetica,Arial,sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(game.combo), 0, 0);

    // small label underneath
    ctx.shadowBlur = 12;
    ctx.fillStyle = `rgba(255,95,116,${0.85})`;
    ctx.font = `800 10px -apple-system,Helvetica,Arial,sans-serif`;
    ctx.letterSpacing = '0.4em';
    ctx.fillText(game.combo >= 50 ? 'UNSTOPPABLE' : game.combo >= 20 ? 'BLAZING' : 'CHAIN', 0, numSize * 0.55);

    ctx.restore();
  }

  // ---- Intro countdown ----
  const introLeft = game.introEnd - t;
  if (introLeft > 0 && t > -1) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,31,61,.9)';
    ctx.shadowBlur = 30;
    ctx.font = `900 ${Math.round(Math.min(W, H) * 0.13)}px -apple-system,Helvetica,Arial,sans-serif`;
    const num = Math.ceil(introLeft);
    ctx.fillText(num > 0 ? String(num) : 'GO', W / 2, H * 0.42);
    ctx.restore();
  }

  ctx.restore(); // camera

  // ---- Vignette (outside camera, always full screen) ----
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawNote(n, t) {
  const x = game.laneX;
  const y = noteY(n, t);
  const dt = n.t - t;
  const near = clamp(1 - Math.abs(dt) / 0.42, 0.25, 1);
  const accent = n.energy > 0.72;

  if (n.type === 'tap') {
    // ---- TAP: minimal concentric circles ----
    const size = 16 + n.energy * 12;

    // outer soft glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 2.6);
    glow.addColorStop(0, `rgba(255,95,116,${0.35 * near})`);
    glow.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, size * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // thin outer ring
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * near})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // inner filled core
    ctx.beginPath();
    ctx.arc(x, y, size * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = accent ? `rgba(255,255,255,${0.95 * near})` : `rgba(255,95,116,${0.9 * near})`;
    ctx.fill();

    // accent extra ring
    if (accent) {
      ctx.beginPath();
      ctx.arc(x, y, size * 1.4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.35 * near})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  } else {
    // ---- SWIPE: thin bar with directional chevrons ----
    const barW = Math.min(game.laneW * 0.6, 190);
    const barH = 40;
    const bx = x - barW / 2;
    const by = y - barH / 2;
    const dir = n.dir; // 1 = right, -1 = left

    // soft glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, barW * 0.9);
    glow.addColorStop(0, `rgba(255,95,116,${0.28 * near})`);
    glow.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(bx - 40, by - 40, barW + 80, barH + 80);

    // bar (thin border only, very subtle fill)
    ctx.beginPath();
    roundRectPath(bx, by, barW, barH, barH / 2);

    // Directional gradient fill
    const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    if (dir === 1) {
      grad.addColorStop(0, `rgba(140,15,34,${0.15 * near})`);
      grad.addColorStop(1, `rgba(255,31,61,${0.4 * near})`);
    } else {
      grad.addColorStop(0, `rgba(255,31,61,${0.4 * near})`);
      grad.addColorStop(1, `rgba(140,15,34,${0.15 * near})`);
    }
    ctx.fillStyle = grad;
    ctx.fill();

    // border
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * near})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // animated chevrons scrolling in swipe direction
    const scrollPhase = ((performance.now() / 1000) * 1.3) % 1;
    const chevW = 9;
    const chevH = 12;
    const chevGap = 16;
    const cx0 = x - dir * (barW * 0.28);
    ctx.save();
    ctx.translate(cx0, y);
    if (dir === -1) ctx.scale(-1, 1);
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * near})`;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      const cx2 = i * chevGap + scrollPhase * chevGap;
      ctx.beginPath();
      ctx.moveTo(cx2 - chevW / 2, -chevH / 2);
      ctx.lineTo(cx2 + chevW / 2, 0);
      ctx.lineTo(cx2 - chevW / 2, chevH / 2);
      ctx.stroke();
    }
    ctx.restore();

    // SWIPE label
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,255,255,${0.45 * near})`;
    ctx.font = '700 8px -apple-system,Helvetica,Arial,sans-serif';
    ctx.fillText(dir === 1 ? 'SWIPE RIGHT' : 'SWIPE LEFT', x, y + barH * 0.55);
    ctx.restore();
  }
}

/* ---------- start / finish ---------- */
async function startGame(song) {
  stopPreview();
  showScreen('game');
  titleWanted = false;
  if (titleAudio) fadeAudio(titleAudio, 0, 300);

  $('#ghTitle').textContent = song.title.toUpperCase();
  $('#ghBpm').textContent = song.bpm ? Math.round(song.bpm) + ' BPM' : '';
  $('#ghScore').textContent = '0';
  $('#healthFill').style.width = '100%';
  $('#healthWrap').classList.remove('low');
  $('#resultOverlay').classList.remove('show');

  if (!song.chart) {
    $('#ghTitle').textContent = 'ANALYZING…';
    await ensureAnalysis(song);
  }
  if (!song.chart || !song.chart.notes.length) {
    $('#ghTitle').textContent = 'NO DATA';
    showScreen('songs');
    return;
  }

  const cfg = DIFF_CFG[song.difficulty] || DIFF_CFG.NORMAL;

  game.song = song;
  game.notes = song.chart.notes.map(n => ({
    t: n.t, type: n.type, dir: n.dir, energy: n.energy,
    hit: false, missed: false, resolved: false
  }));
  game.approach = cfg.approach;
  game.missWindow = cfg.missWindow;
  game.score = 0;
  game.combo = 0;
  game.maxCombo = 0;
  game.health = 100;
  game.perfect = 0;
  game.great = 0;
  game.good = 0;
  game.miss = 0;
  game.particles = [];
  game.popups = [];
  game.ripples = [];
  game.padFlash = 0;
  game.hitFlash = 0;
  game.pointers.clear();
  game.failed = false;
  game.finished = false;
  game.cam.shakeMag = 0;
  game.cam.zoom = 1;
  game.streak.scale = 1;
  game.streak.scaleVel = 0;
  game.streak.y = 0;
  game.streak.yVel = 0;
  game.streak.glow = 0;
  game.streak.alpha = 0;
  game.lastFrame = performance.now();

  resizeCanvas();

  const a = new Audio(song.url);
  a.volume = 0.92;
  a.preload = 'auto';
  a.crossOrigin = 'anonymous';
  game.audio = a;

  try {
    const ac = actx();
    game.audioCtx = ac;
    const src = ac.createMediaElementSource(a);
    game.analyser = ac.createAnalyser();
    game.analyser.fftSize = 256;
    game.analyser.smoothingTimeConstant = .72;
    game.freq = new Uint8Array(game.analyser.frequencyBinCount);
    src.connect(game.analyser);
    game.analyser.connect(ac.destination);
  } catch(e) {
    game.analyser = null;
    game.freq = null;
  }

  a.addEventListener('ended', () => {
    if (!game.finished) setTimeout(finishGame, 550);
  });

  try {
    await a.play();
    game.startCtxTime = actx().currentTime;
    game.startAudioTime = a.currentTime;
  } catch (e) {
    const retry = () => {
      a.play().then(() => {
        game.startCtxTime = actx().currentTime;
        game.startAudioTime = a.currentTime;
      }).catch(() => {});
      window.removeEventListener('pointerdown', retry);
    };
    window.addEventListener('pointerdown', retry);
  }

  $('#ghTitle').textContent = song.title.toUpperCase();

  game.running = true;
  game.introEnd = 2.3;
  game.raf = requestAnimationFrame(gameLoop);
}

function finishGame() {
  if (game.finished) return;
  game.finished = true;
  game.running = false;
  cancelAnimationFrame(game.raf);
  const a = game.audio;
  if (a) {
    fadeAudio(a, 0, 900);
    setTimeout(() => { try { a.pause(); } catch (e) {} }, 950);
  }
  const total = game.perfect + game.great + game.good + game.miss;
  const weighted = game.perfect * 320 + game.great * 220 + game.good * 120;
  const maxWeighted = total * 320;
  const acc = maxWeighted > 0 ? weighted / maxWeighted : 0;
  let grade;
  if (game.failed) grade = 'F';
  else if (acc >= 0.97) grade = 'S';
  else if (acc >= 0.90) grade = 'A';
  else if (acc >= 0.80) grade = 'B';
  else if (acc >= 0.66) grade = 'C';
  else grade = 'D';
  $('#resGrade').textContent = grade;
  $('#resVerdict').textContent = game.failed ? 'Signal Lost' : (grade === 'S' ? 'Flawless' : 'Track Cleared');
  $('#resTrack').textContent = game.song ? game.song.title.toUpperCase() : '—';
  $('#resScore').textContent = game.score.toLocaleString();
  $('#resPerfect').textContent = game.perfect;
  $('#resGood').textContent = game.great + game.good;
  $('#resMiss').textContent = game.miss;
  $('#resCombo').textContent = game.maxCombo;
  $('#resultOverlay').classList.add('show');
}

function quitGame() {
  game.running = false;
  game.finished = true;
  cancelAnimationFrame(game.raf);
  if (game.audio) { try { game.audio.pause(); } catch (e) {} game.audio = null; }
  game.pointers.clear();
  $('#resultOverlay').classList.remove('show');
  showScreen('songs');
}

/* ============================================================
   UI WIRING
   ============================================================ */
$('#playBtn').addEventListener('click', () => { actx(); showScreen('songs'); });
$('#backBtn').addEventListener('click', () => { stopPreview(); showScreen('menu'); });
$('#quitBtn').addEventListener('click', quitGame);
$('#resBack').addEventListener('click', () => {
  $('#resultOverlay').classList.remove('show');
  showScreen('songs');
});
$('#resRetry').addEventListener('click', () => {
  $('#resultOverlay').classList.remove('show');
  if (game.song) startGame(game.song);
});

$('#importBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  files.forEach(f => {
    songs.push({
      id: 'u' + Math.random().toString(36).slice(2),
      title: prettyName(f.name),
      url: URL.createObjectURL(f),
      status: 'pending',
      duration: 0
    });
  });
  if (files.length) { renderSongs(); analyzeQueue(); }
  e.target.value = '';
});

let unlocked = false;
function unlock() {
  if (unlocked) return;
  unlocked = true;
  actx();
  tryPlayTitle();
  $('#tapHint').classList.add('hidden');
}
window.addEventListener('pointerdown', unlock, { once: false });
window.addEventListener('keydown', unlock, { once: false });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (game.running && game.audio) { try { game.audio.pause(); } catch (e) {} }
  } else {
    if (game.running && game.audio && game.audio.paused && !game.finished) {
      game.audio.play().catch(() => {});
    }
    if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  }
});

document.addEventListener('touchmove', e => {
  if (e.target.closest && e.target.closest('.song-list')) return;
  e.preventDefault();
}, { passive: false });

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  buildEq();
  eqLoop();

  const icon = $('#menuIcon');
  icon.addEventListener('error', () => {
    icon.src = 'mainassets/IMG_2105.png';
    icon.classList.remove('hidden');
  });
  icon.src = 'mainassets/icon.svg';

  const bgEl = $('#menuBg');
  const testImg = new Image();
  testImg.onerror = () => { bgEl.style.backgroundImage = 'none'; };
  testImg.src = 'mainassets/IMG_2105.png';

  initTitleMusic().catch(() => {});

  const names = await listDir('music/');
  names.forEach(n => {
    songs.push({
      id: 'f' + songs.length,
      title: prettyName(n),
      url: assetUrl('music/', n),
      status: 'pending'
    });
  });

  if (!songs.length) {
    try {
      const built = await buildBuiltinSong();
      songs.push(built);
    } catch (e) { console.warn('built-in track failed', e); }
  }

  renderSongs();
  analyzeQueue();
}

boot();
})();
</script>
