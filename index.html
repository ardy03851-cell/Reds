<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#08080a" />
<title>PULSE // RED</title>
<link rel="apple-touch-icon" href="mainassets/icon.png" />
<link rel="icon" href="mainassets/icon.png" />
<style>
/* ============================================================
   PULSE // RED  —  serious rhythm reactor
   ============================================================ */
:root{
  --red:#ff1f3d;
  --red-soft:#ff5f74;
  --red-deep:#8c0f22;
  --bg:#07070a;
  --panel:#0e0e12;
  --text:#ececf0;
  --muted:#6a6a74;
  --line:rgba(255,31,61,.16);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
img{-webkit-user-drag:none;}

/* ---------- screens ---------- */
.screen{
  position:fixed;inset:0;opacity:0;pointer-events:none;
  transition:opacity .6s var(--ease), transform .7s var(--ease), filter .6s var(--ease);
  will-change:opacity,transform;
  filter:blur(6px);
}
.screen.active{opacity:1;pointer-events:auto;filter:blur(0);}
#menu:not(.active){transform:translateX(-3%) scale(.98);}
#songs:not(.active){transform:translateX(4%);}
#game:not(.active){transform:scale(1.02);}

/* ============================================================
   MAIN MENU
   ============================================================ */
#menu{background:#050507;overflow:hidden;}
#menuBg{
  position:absolute;inset:0;
  background-image:url('mainassets/bg.png');
  background-size:cover;background-position:center;
  background-color:#0a0407;
  transform:scale(1.08);
  filter:saturate(.72) contrast(1.1) brightness(.68);
  transition:transform 14s ease-out, opacity .8s ease;
}
#menu.ready #menuBg{transform:scale(1.0);}
#menu .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(130% 90% at 12% 55%, rgba(255,31,61,.18) 0%, rgba(0,0,0,0) 52%),
    linear-gradient(90deg, rgba(5,5,8,.97) 0%, rgba(5,5,8,.78) 36%, rgba(5,5,8,.42) 62%, rgba(5,5,8,.9) 100%),
    linear-gradient(180deg, rgba(5,5,8,.75) 0%, rgba(5,5,8,0) 28%, rgba(5,5,8,.92) 100%);
}
#menu .grain{
  position:absolute;inset:0;opacity:.05;pointer-events:none;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0 1px, transparent 1px 3px);
}
#menu .scanline{
  position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:linear-gradient(180deg, transparent 0%, rgba(255,31,61,.22) 50%, transparent 100%);
  mix-blend-mode:screen;
  animation:scan 8s linear infinite;
}
@keyframes scan{
  0%{transform:translateY(-100%);}
  100%{transform:translateY(100%);}
}
.menu-inner{
  position:absolute;inset:0;display:flex;align-items:center;
  padding:0 max(40px,6vw);
  padding-bottom:140px;
}
.title-block{max-width:640px;position:relative;opacity:0;transform:translateY(18px);}
#menu.ready .title-block{
  opacity:1;transform:translateY(0);
  transition:opacity 1.1s var(--ease) .15s, transform 1.1s var(--ease) .15s;
}
.side-rule{
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--red) 30%, var(--red) 70%, transparent);
  opacity:.85;
  margin-left:calc(-1 * max(22px,2.6vw));
  box-shadow:0 0 22px rgba(255,31,61,.6);
}
.menu-icon{
  width:56px;height:56px;object-fit:contain;display:block;margin-bottom:24px;
  filter:drop-shadow(0 0 22px rgba(255,31,61,.55));
}
.menu-icon.hidden{display:none;}
.game-title{
  font-size:clamp(52px,9.2vw,132px);
  line-height:.85;font-weight:900;letter-spacing:-.048em;text-transform:uppercase;
  text-shadow:0 0 70px rgba(255,31,61,.4), 0 4px 40px rgba(0,0,0,.9);
}
.game-title i{
  color:var(--red);font-style:normal;
  text-shadow:0 0 30px rgba(255,31,61,.95), 0 0 90px rgba(255,31,61,.6);
}
.tagline{
  margin-top:24px;font-size:11px;letter-spacing:.46em;color:var(--muted);text-transform:uppercase;
}
.play-btn{
  margin-top:46px;position:relative;overflow:hidden;
  border:1px solid rgba(255,31,61,.5);
  padding:20px 68px;font-size:14px;font-weight:800;letter-spacing:.44em;text-transform:uppercase;
  transition:border-color .5s var(--ease), box-shadow .5s var(--ease), transform .25s var(--ease);
  background:rgba(255,31,61,.02);
}
.play-btn span{position:relative;z-index:2;}
.play-btn::before{
  content:'';position:absolute;inset:0;background:var(--red);
  transform:translateX(-101%);
  transition:transform .55s var(--ease);
  box-shadow:0 0 40px rgba(255,31,61,.7);
}
.play-btn:hover::before,.play-btn:active::before{transform:translateX(0);}
.play-btn:hover{border-color:var(--red);box-shadow:0 0 48px rgba(255,31,61,.45);}
.play-btn:active{transform:scale(.97);}

/* equalizer */
.eq{
  position:absolute;left:0;right:0;bottom:0;height:130px;
  display:flex;align-items:flex-end;gap:3px;
  opacity:.85;pointer-events:none;
  mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
  padding:0 max(10px,1vw);
}
.eq i{
  flex:1 1 0;height:2px;display:block;
  background:linear-gradient(to top, rgba(255,31,61,1), rgba(255,31,61,.08));
  will-change:height;
  border-radius:1px 1px 0 0;
}
.hint{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.46em;color:rgba(255,255,255,.42);
  text-transform:uppercase;transition:opacity .6s;pointer-events:none;
  white-space:nowrap;
}
.hint.hidden{opacity:0;}
.menu-tools{
  position:absolute;right:max(22px,3vw);bottom:24px;
  display:flex;gap:10px;
}
.tool-btn{
  font-size:10px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;
  color:var(--muted);border:1px solid rgba(255,255,255,.1);
  padding:10px 18px;transition:.3s var(--ease);background:rgba(0,0,0,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.tool-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.14);}
.tool-btn.warn{border-color:rgba(255,31,61,.4);color:var(--red-soft);}

/* ============================================================
   SONG SELECT
   ============================================================ */
#songs{
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,31,61,.14) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#0a0508 0%, #07070a 45%, #050506 100%);
  display:flex;flex-direction:column;
}
.songs-header{
  display:flex;align-items:center;gap:18px;
  padding:24px max(28px,4vw);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
  background:rgba(6,6,9,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.songs-header h2{
  font-size:13px;letter-spacing:.5em;text-transform:uppercase;font-weight:800;
  color:#fff;
}
.songs-header .count{
  font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;
  margin-left:6px;font-weight:700;
}
.ghost-btn{
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;
  color:var(--muted);border:1px solid rgba(255,255,255,.1);
  padding:12px 22px;transition:.3s var(--ease);
}
.ghost-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.1);}
.ghost-btn:active{transform:scale(.96);}
.ghost-btn.spacer{margin-left:auto;}
.ghost-btn.accent{border-color:rgba(255,31,61,.5);color:var(--red-soft);}
.ghost-btn.accent:hover{color:#fff;background:rgba(255,31,61,.2);}

.song-list{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px max(28px,4vw) 100px;
  display:flex;flex-direction:column;gap:14px;
  touch-action:pan-y;
}
.song-list::-webkit-scrollbar{width:6px;}
.song-list::-webkit-scrollbar-track{background:transparent;}
.song-list::-webkit-scrollbar-thumb{background:rgba(255,31,61,.4);border-radius:3px;}

.card{
  position:relative;height:118px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,255,255,.008));
  display:flex;align-items:center;
  padding:0 28px;overflow:hidden;cursor:pointer;
  transition:border-color .4s var(--ease), background .4s var(--ease),
             transform .4s var(--ease), box-shadow .4s var(--ease);
  border-radius:3px;
}
.card::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--red);transform:scaleY(0);transform-origin:center;
  transition:transform .4s var(--ease);
  box-shadow:0 0 24px rgba(255,31,61,.8);
}
.card:hover,.card.previewing{
  border-color:rgba(255,31,61,.55);
  background:linear-gradient(90deg, rgba(255,31,61,.12), rgba(255,31,61,.015));
  transform:translateX(10px);
  box-shadow:0 0 50px rgba(255,31,61,.14), inset 0 0 70px rgba(255,31,61,.05);
}
.card:hover::after,.card.previewing::after{transform:scaleY(1);}
.card:active{transform:translateX(10px) scale(.995);}

.card-info{position:relative;z-index:3;max-width:46%;min-width:0;}
.card-title{
  font-size:clamp(15px,2.1vw,21px);font-weight:800;letter-spacing:.01em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 22px rgba(0,0,0,.95);
}
.card-meta{
  margin-top:9px;font-size:10px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.card-diff{
  position:relative;z-index:3;margin-left:auto;
  font-size:11px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;
  padding:10px 20px;border:1px solid rgba(255,255,255,.14);color:var(--muted);
  transition:.3s var(--ease);flex:0 0 auto;
  background:rgba(0,0,0,.35);
}
.card-diff.d-easy{color:#b8b8c2;border-color:rgba(255,255,255,.22);}
.card-diff.d-normal{color:var(--red-soft);border-color:rgba(255,95,116,.5);}
.card-diff.d-hard{color:var(--red);border-color:rgba(255,31,61,.65);box-shadow:0 0 24px rgba(255,31,61,.25);}
.card-diff.d-extreme{
  color:#fff;background:var(--red);border-color:var(--red);
  box-shadow:0 0 34px rgba(255,31,61,.7);
}
.card-diff.d-pending{color:var(--muted);border-color:rgba(255,255,255,.1);}

/* vinyl */
.vinyl{
  position:absolute;left:50%;top:50%;width:106px;height:106px;
  margin:-53px 0 0 -53px;border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, #1b1b22 0 1.5px, #0b0b0f 1.5px 3.5px),
    #0d0d11;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 14px 50px rgba(0,0,0,.9);
  opacity:.2;z-index:1;
  transition:opacity .5s var(--ease), box-shadow .5s var(--ease), transform .5s var(--ease);
  pointer-events:none;
}
.vinyl::after{
  content:'';position:absolute;inset:31%;border-radius:50%;
  background:radial-gradient(circle, var(--red) 0 38%, #64091a 39% 100%);
  box-shadow:0 0 18px rgba(255,31,61,.6);
}
.vinyl::before{
  content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#07070a;z-index:3;
}
.card:hover .vinyl,.card.previewing .vinyl{
  opacity:.98;
  transform:scale(1.05);
  animation:spin 1.7s linear infinite;
  box-shadow:inset 0 0 0 1px rgba(255,31,61,.6), 0 0 55px rgba(255,31,61,.5);
}
@keyframes spin{from{transform:scale(1.05) rotate(0)}to{transform:scale(1.05) rotate(360deg)}}

.empty-note{
  padding:60px 8px;color:var(--muted);font-size:12px;
  letter-spacing:.24em;text-transform:uppercase;line-height:2.4;
  max-width:640px;
}
.empty-note b{color:var(--red-soft);font-weight:800;}

/* ============================================================
   GAME
   ============================================================ */
#game{background:#050506;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
.game-hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:max(18px,3vh) max(22px,3vw);
  pointer-events:none;
}
.gh-title{
  font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);font-weight:800;
  max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.health{
  margin-top:14px;width:min(260px,36vw);height:4px;background:rgba(255,255,255,.08);
  overflow:hidden;border-radius:2px;
}
.health-fill{
  height:100%;width:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));
  transition:width .18s linear, background .4s;
  box-shadow:0 0 18px rgba(255,31,61,.9);
}
.health.low .health-fill{background:linear-gradient(90deg,#ff1f3d,#ff6b3d);}
.gh-right{display:flex;align-items:center;gap:22px;pointer-events:auto;}
.gh-score{
  font-size:clamp(22px,3.4vw,34px);font-weight:900;letter-spacing:.05em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,31,61,.55);
}
.gh-quit{
  pointer-events:auto;width:42px;height:42px;border:1px solid rgba(255,255,255,.12);
  color:var(--muted);font-size:16px;transition:.3s var(--ease);line-height:1;
  border-radius:2px;
}
.gh-quit:hover{border-color:var(--red);color:#fff;background:rgba(255,31,61,.14);}

/* overlay */
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,6,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .55s var(--ease);
  padding:20px;
}
.overlay.show{opacity:1;pointer-events:auto;}
.result-panel{
  width:min(560px,90vw);border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,31,61,.07), rgba(0,0,0,0) 60%);
  padding:46px 44px 38px;text-align:center;
  transform:translateY(16px) scale(.96);
  transition:transform .6s var(--ease) .1s;
  border-radius:4px;
}
.overlay.show .result-panel{transform:translateY(0) scale(1);}
.result-grade{
  font-size:clamp(68px,13vw,118px);font-weight:900;line-height:1;letter-spacing:-.05em;
  color:var(--red);text-shadow:0 0 70px rgba(255,31,61,.85);
}
.result-title{
  margin-top:10px;font-size:11px;letter-spacing:.46em;text-transform:uppercase;color:var(--muted);
}
.result-track{
  margin-top:28px;font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.result-score{
  margin-top:20px;font-size:clamp(32px,5.4vw,48px);font-weight:900;font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px rgba(255,31,61,.4);
}
.result-grid{
  margin-top:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  border-top:1px solid var(--line);padding-top:26px;
}
.result-grid div span{display:block;font-size:9px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;}
.result-grid div b{display:block;margin-top:9px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.result-actions{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.act-btn{
  border:1px solid rgba(255,255,255,.14);padding:16px 36px;
  font-size:11px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  transition:.3s var(--ease);color:var(--muted);border-radius:2px;
}
.act-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.16);}
.act-btn.primary{border-color:var(--red);color:#fff;background:rgba(255,31,61,.18);}
.act-btn.primary:hover{background:var(--red);box-shadow:0 0 34px rgba(255,31,61,.5);}
.act-btn:active{transform:scale(.97);}

/* toast */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  background:rgba(12,12,16,.95);border:1px solid var(--line);
  padding:14px 26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--text);opacity:0;pointer-events:none;transition:.4s var(--ease);
  z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:2px;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{border-color:rgba(255,31,61,.6);color:var(--red-soft);}
</style>
</head>
<body>

<!-- ========================= MAIN MENU ========================= -->
<section id="menu" class="screen active">
  <div id="menuBg"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div class="scanline"></div>

  <div class="menu-inner">
    <div class="title-block">
      <div class="side-rule"></div>
      <img id="menuIcon" class="menu-icon hidden" src="" alt="" />
      <h1 class="game-title">PULSE<br><i>//</i>RED</h1>
      <p class="tagline" id="tagline">Rhythm Reactor</p>
      <button id="playBtn" class="play-btn"><span>Play</span></button>
    </div>
  </div>

  <div class="eq" id="eq"></div>
  <div class="hint" id="tapHint">Tap anywhere to enable audio</div>

  <div class="menu-tools">
    <button id="setupAssetsBtn" class="tool-btn" title="Choose bg.png and a menu music file">Setup Assets</button>
  </div>
</section>

<!-- ========================= SONG SELECT ========================= -->
<section id="songs" class="screen">
  <header class="songs-header">
    <button id="backBtn" class="ghost-btn">← Back</button>
    <h2>Select Track<span class="count" id="songCount"></span></h2>
    <button id="importFolderBtn" class="ghost-btn spacer accent">Add Folder</button>
    <button id="importFilesBtn" class="ghost-btn">Add Files</button>
    <input type="file" id="fileInput" accept="audio/*" multiple hidden />
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
  </header>
  <div class="song-list" id="songList"></div>
</section>

<!-- ========================= GAME ========================= -->
<section id="game" class="screen">
  <canvas id="cv"></canvas>

  <div class="game-hud">
    <div>
      <div class="gh-title" id="ghTitle">—</div>
      <div class="health" id="healthWrap"><div class="health-fill" id="healthFill"></div></div>
    </div>
    <div class="gh-right">
      <div class="gh-score" id="ghScore">0</div>
      <button class="gh-quit" id="quitBtn">✕</button>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="result-panel">
      <div class="result-grade" id="resGrade">S</div>
      <div class="result-title" id="resVerdict">Cleared</div>
      <div class="result-track" id="resTrack">—</div>
      <div class="result-score" id="resScore">0</div>
      <div class="result-grid">
        <div><span>Perfect</span><b id="resPerfect">0</b></div>
        <div><span>Good</span><b id="resGood">0</b></div>
        <div><span>Miss</span><b id="resMiss">0</b></div>
        <div><span>Max Combo</span><b id="resCombo">0</b></div>
      </div>
      <div class="result-actions">
        <button class="act-btn" id="resBack">Tracks</button>
        <button class="act-btn primary" id="resRetry">Retry</button>
      </div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script>
(() => {
'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const AUDIO_RE = /\.(mp3|m4a|aac|ogg|oga|wav|flac|opus|weba)$/i;
const IMAGE_RE = /\.(png|jpe?g|webp|gif|avif|bmp)$/i;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = s => {
  if (!isFinite(s) || s <= 0) return '--:--';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
};

let toastTimer = 0;
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ============================================================
   INDEXEDDB  (persistent imported files)
   ============================================================ */
const DB_NAME = 'pulse_red_v1';
let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, 1); }
    catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('music')) db.createObjectStore('music', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets', { keyPath: 'id' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}

async function idbAll(store) {
  try {
    const db = await openDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  } catch (e) { return []; }
}

async function idbPut(store, obj) {
  try {
    const db = await openDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { return false; }
}

async function idbClear(store) {
  try {
    const db = await openDB();
    return await new Promise((res) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => res(true);
    });
  } catch (e) { return false; }
}

/* ============================================================
   AUDIO CONTEXT
   ============================================================ */
let AC = null;
function actx() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}

function fadeAudio(a, to, ms) {
  if (!a) return;
  if (a._fadeRaf) cancelAnimationFrame(a._fadeRaf);
  const from = a.volume, start = performance.now();
  const step = () => {
    const k = clamp((performance.now() - start) / ms, 0, 1);
    try { a.volume = clamp(from + (to - from) * k, 0, 1); } catch (e) {}
    if (k < 1) a._fadeRaf = requestAnimationFrame(step);
    else a._fadeRaf = 0;
  };
  a._fadeRaf = requestAnimationFrame(step);
}

/* ============================================================
   ASSET DISCOVERY
   Works with:
     1. IndexedDB stored files   (persistent, user-picked)
     2. <dir>/manifest.json      (fastest server path)
     3. Directory listing HTML   (nginx / apache / python server)
     4. Common filenames         (probe with HEAD)
     5. Built-in generated audio (music only)
   ============================================================ */
async function probe(url) {
  // HEAD first, fall back to GET range
  try {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (r.ok) return true;
  } catch (e) {}
  try {
    const r = await fetch(url, { method: 'GET', cache: 'no-store', headers: { Range: 'bytes=0-1' } });
    return r.ok;
  } catch (e) { return false; }
}

async function listDirNames(dir, regex) {
  const out = [];
  const seen = new Set();

  // manifest.json
  try {
    const r = await fetch(dir + 'manifest.json', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j && (j.files || j.tracks || j.songs)) || [];
      for (const f of arr) {
        const name = typeof f === 'string' ? f : (f && (f.file || f.name)) || '';
        if (name && regex.test(name) && !seen.has(name)) { seen.add(name); out.push(name); }
      }
      if (out.length) return out;
    }
  } catch (e) {}

  // directory listing
  try {
    const r = await fetch(dir, { cache: 'no-store' });
    if (r.ok) {
      const txt = await r.text();
      const re = /href\s*=\s*["']([^"']+)["']/gi;
      let m;
      while ((m = re.exec(txt))) {
        let h = m[1];
        if (/^(https?:)?\/\//i.test(h) || h[0] === '?' || h[0] === '#') continue;
        h = h.split('?')[0].split('#')[0];
        let name;
        try { name = decodeURIComponent(h.replace(/\/+$/, '').split('/').pop()); }
        catch (e) { name = h.split('/').pop(); }
        if (name && regex.test(name) && !seen.has(name)) { seen.add(name); out.push(name); }
      }
    }
  } catch (e) {}

  return out;
}

let titleAudio = null, titleAnalyser = null, titleSrcNode = null;
const eqBars = [];
const TITLE_VOL = 0.42;
let titleWanted = true;
let titleMusicUrl = null;

function buildEq() {
  const eq = $('#eq');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 64; i++) {
    const b = document.createElement('i');
    frag.appendChild(b);
    eqBars.push(b);
  }
  eq.appendChild(frag);
}

function attachTitleAnalyser(audio) {
  try {
    const ctx = actx();
    if (!ctx) return;
    if (!titleSrcNode) {
      titleSrcNode = ctx.createMediaElementSource(audio);
      titleAnalyser = ctx.createAnalyser();
      titleAnalyser.fftSize = 256;
      titleAnalyser.smoothingTimeConstant = 0.78;
      titleSrcNode.connect(titleAnalyser);
      titleAnalyser.connect(ctx.destination);
    }
  } catch (e) {
    titleAnalyser = null;
  }
}

function startTitleMusic(url) {
  if (!url || titleAudio) return;
  titleMusicUrl = url;
  const a = new Audio(url);
  a.loop = true;
  a.volume = 0;
  a.crossOrigin = 'anonymous';
  a.preload = 'auto';
  titleAudio = a;
  attachTitleAnalyser(a);
  tryPlayTitle();
}

function tryPlayTitle() {
  if (!titleAudio) return;
  if (titleAudio.paused) titleAudio.play().catch(() => {});
  fadeAudio(titleAudio, titleWanted ? TITLE_VOL : 0, 1400);
}

const freqData = new Uint8Array(128);
let eqPhase = 0;
function eqLoop() {
  requestAnimationFrame(eqLoop);
  if (!eqBars.length) return;
  const n = eqBars.length;

  if (titleAnalyser && titleAudio && !titleAudio.paused && titleAudio.volume > 0.02) {
    titleAnalyser.getByteFrequencyData(freqData);
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.pow(i / n, 1.42) * (freqData.length * 0.72)) + 1;
      const v = (freqData[idx] || 0) / 255;
      eqBars[i].style.height = (2 + v * v * 92).toFixed(1) + 'px';
    }
  } else {
    eqPhase += 0.016;
    for (let i = 0; i < n; i++) {
      const v = 0.5 + 0.5 * Math.sin(eqPhase * 1.7 + i * 0.34);
      eqBars[i].style.height = (2 + v * 12).toFixed(1) + 'px';
    }
  }
}

/* ============================================================
   BUILT-IN TRACK  (generated offline, always works)
   ============================================================ */
function bufferToWavUrl(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length;
  const sr = buffer.sampleRate;
  const bytes = 44 + len * numCh * 2;
  const ab = new ArrayBuffer(bytes);
  const view = new DataView(ab);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); view.setUint32(4, bytes - 8, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true); view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  wstr(36, 'data'); view.setUint32(40, len * numCh * 2, true);

  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = clamp(chans[c][i], -1, 1);
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      off += 2;
    }
  }
  return URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
}

async function buildBuiltinSong() {
  const sr = 44100;
  const bpm = 132;
  const beat = 60 / bpm;
  const bars = 28;
  const dur = bars * 4 * beat + 2.4;

  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(2, Math.ceil(sr * dur), sr);

  const bus = ctx.createGain(); bus.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.004;
  bus.connect(comp); comp.connect(ctx.destination);

  const nb = ctx.createBuffer(1, Math.floor(sr * 1.5), sr);
  { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  const kick = (t, g = 1) => {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(170, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.004);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + 0.5);
  };
  const snare = (t, g = 0.4) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    s.connect(hp); hp.connect(gn); gn.connect(bus);
    s.start(t); s.stop(t + 0.2);
  };
  const hat = (t, g = 0.14, dec = 0.045) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7600;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    s.connect(hp); hp.connect(gn); gn.connect(bus);
    s.start(t); s.stop(t + dec + 0.03);
  };
  const bassNote = (t, f, d, g = 0.42) => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 9;
    lp.frequency.setValueAtTime(520, t);
    lp.frequency.exponentialRampToValueAtTime(130, t + d);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.012);
    gn.gain.setValueAtTime(g, t + d - 0.06);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(lp); lp.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + d + 0.06);
  };
  const stab = (t, f, d, g = 0.07) => {
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.Q.value = 5;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(lp); lp.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + d + 0.03);
  };

  const roots = [55.00, 55.00, 65.41, 49.00];
  const scale = [0, 3, 7, 10, 12];

  for (let bar = 0; bar < bars; bar++) {
    const bt = bar * 4 * beat;
    const root = roots[bar % 4];
    const section = bar < 4 ? 0 : bar < 10 ? 1 : bar < 22 ? 2 : 3;

    const hatDiv = section >= 2 ? 4 : 2;
    for (let i = 0; i < 4 * hatDiv; i++) {
      const t = bt + i * (beat / hatDiv);
      hat(t, i % hatDiv === 0 ? 0.10 : 0.055, 0.035);
    }
    if (section >= 1) for (let i = 0; i < 4; i++) kick(bt + i * beat, 1);
    else if (bar >= 2) for (let i = 0; i < 4; i++) kick(bt + i * beat, 0.8);

    if (section >= 2) { snare(bt + beat, 0.32); snare(bt + 3 * beat, 0.32); }

    if (section >= 1) {
      for (let i = 0; i < 4; i++) bassNote(bt + i * beat, root, beat * 0.92, 0.4);
      if (section >= 2) for (let i = 0; i < 4; i++) bassNote(bt + i * beat + beat * 0.5, root, beat * 0.4, 0.22);
    } else {
      for (let i = 0; i < 2; i++) bassNote(bt + i * 2 * beat, root, beat * 1.6, 0.3);
    }

    if (section >= 2 && (bar % 2 === 0)) {
      for (let i = 0; i < 4; i++) {
        if ((bar + i) % 3 === 0) continue;
        stab(bt + (1.5 + i) * beat, root * 4 * Math.pow(2, scale[(bar + i) % scale.length] / 12), 0.22, 0.06);
      }
    }
  }

  const rendered = await ctx.startRendering();
  const url = bufferToWavUrl(rendered);
  return {
    id: 'builtin',
    title: 'Null Signal (Built-in)',
    url,
    buffer: rendered,
    status: 'pending',
    builtin: true,
    source: 'builtin'
  };
}

/* ============================================================
   BEAT ANALYSIS / CHART GENERATION
   ============================================================ */
function mixToMono(buffer) {
  const n = buffer.length;
  const chs = [];
  for (let c = 0; c < buffer.numberOfChannels; c++) chs.push(buffer.getChannelData(c));
  const out = new Float32Array(n);
  if (chs.length === 1) { out.set(chs[0]); return out; }
  const inv = 1 / chs.length;
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let c = 0; c < chs.length; c++) s += chs[c][i];
    out[i] = s * inv;
  }
  return out;
}

function downsample(data, sr, target) {
  if (sr <= target) return data;
  const ratio = sr / target;
  const outLen = Math.floor(data.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(data.length, Math.floor((i + 1) * ratio));
    let s = 0;
    for (let j = start; j < end; j++) s += data[j];
    out[i] = s / Math.max(1, end - start);
  }
  return out;
}

function fftInPlace(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    const half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cwr = 1, cwi = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = i + k + half;
        const ur = re[a], ui = im[a];
        const vr = re[b] * cwr - im[b] * cwi;
        const vi = re[b] * cwi + im[b] * cwr;
        re[a] = ur + vr; im[a] = ui + vi;
        re[b] = ur - vr; im[b] = ui - vi;
        const nwr = cwr * wr - cwi * wi;
        cwi = cwr * wi + cwi * wr;
        cwr = nwr;
      }
    }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildChart(buffer) {
  const N = 1024, H = 512, TARGET = 11025;
  const mono = downsample(mixToMono(buffer), buffer.sampleRate, TARGET);
  const frames = Math.max(1, Math.floor((mono.length - N) / H));
  const hop = H / TARGET;

  const hann = new Float32Array(N);
  for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));

  const re = new Float32Array(N), im = new Float32Array(N);
  const mag = new Float32Array(N / 2), prev = new Float32Array(N / 2);

  const flux = new Float32Array(frames);
  const lowE = new Float32Array(frames), midE = new Float32Array(frames), hiE = new Float32Array(frames);

  const NB = N / 2, invN = 1 / (N / 2);

  for (let f = 0; f < frames; f++) {
    const off = f * H;
    for (let i = 0; i < N; i++) { re[i] = mono[off + i] * hann[i]; im[i] = 0; }
    fftInPlace(re, im);

    let fl = 0, lo = 0, mi = 0, hi = 0;
    for (let k = 0; k < NB; k++) {
      const m = Math.sqrt(re[k] * re[k] + im[k] * im[k]) * invN;
      mag[k] = m;
      const d = m - prev[k];
      if (d > 0) fl += d;
      prev[k] = m;
      if (k >= 1 && k < 12) lo += m;
      else if (k >= 12 && k < 60) mi += m;
      else if (k >= 60 && k < 250) hi += m;
    }
    flux[f] = fl; lowE[f] = lo; midE[f] = mi; hiE[f] = hi;
  }

  let maxF = 0;
  for (let f = 0; f < frames; f++) if (flux[f] > maxF) maxF = flux[f];
  if (maxF > 0) for (let f = 0; f < frames; f++) flux[f] /= maxF;

  const W = 16;
  const onsets = [];
  let lastT = -10;
  const MIN_GAP = 0.115;

  for (let f = 2; f < frames - 2; f++) {
    const v = flux[f];
    if (v < flux[f - 1] || v < flux[f + 1]) continue;
    let sum = 0, cnt = 0;
    const a = Math.max(0, f - W), b = Math.min(frames, f + W + 1);
    for (let j = a; j < b; j++) { sum += flux[j]; cnt++; }
    const th = (sum / cnt) * 1.75 + 0.006;
    if (v < th) continue;
    const t = f * hop;
    if (t - lastT < MIN_GAP) continue;
    lastT = t;
    onsets.push({ t, f, v });
  }

  const rnd = mulberry32(0x9E3779B9 ^ onsets.length);
  const notes = [];
  let prevLane = -1;

  for (const o of onsets) {
    const lo = lowE[o.f], mi = midE[o.f], hi = hiE[o.f];
    const tot = lo + mi + hi + 1e-9;
    let lane;
    const r = rnd();
    if (lo / tot > 0.55) lane = r < 0.5 ? 0 : 3;
    else if (hi / tot > 0.42) lane = r < 0.5 ? 1 : 2;
    else lane = Math.floor(r * 4);
    if (lane === prevLane && rnd() < 0.65) lane = (lane + 1 + Math.floor(rnd() * 3)) % 4;
    prevLane = lane;
    notes.push({ t: o.t, lane });
  }

  const duration = buffer.duration;
  const density = duration > 0 ? notes.length / duration : 0;
  let difficulty;
  if (density < 1.6) difficulty = 'EASY';
  else if (density < 2.6) difficulty = 'NORMAL';
  else if (density < 3.8) difficulty = 'HARD';
  else difficulty = 'EXTREME';

  return { notes, duration, density, difficulty };
}

const DIFF_CFG = {
  EASY:    { approach: 2.00 },
  NORMAL:  { approach: 1.70 },
  HARD:    { approach: 1.40 },
  EXTREME: { approach: 1.15 }
};

/* ============================================================
   SONG LIBRARY
   ============================================================ */
const songs = [];
let analyzing = false;
let assetSetupOpen = false;

function prettyName(fn) {
  return fn.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled';
}

function ensureAnalysis(song) {
  if (song.promise) return song.promise;
  song.promise = (async () => {
    song.status = 'analyzing';
    updateCard(song);
    try {
      let buf = song.buffer || null;
      if (!buf) {
        const res = await fetch(song.url);
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        const ab = await res.arrayBuffer();
        const ctx = actx();
        if (!ctx) throw new Error('no audio context');
        buf = await ctx.decodeAudioData(ab);
      }
      const chart = buildChart(buf);
      song.chart = chart;
      song.duration = chart.duration;
      song.difficulty = chart.difficulty;
      song.noteCount = chart.notes.length;
      song.density = chart.density;
      song.status = 'ready';
    } catch (e) {
      console.warn('analyze failed', song.title, e);
      song.status = 'error';
      song.err = String(e && e.message || e);
    }
    song.buffer = null;
    updateCard(song);
    updateSongCount();
    return song;
  })();
  return song.promise;
}

async function analyzeQueue() {
  if (analyzing) return;
  analyzing = true;
  for (const s of songs) {
    if (s.status === 'pending') {
      await ensureAnalysis(s);
      await new Promise(r => setTimeout(r, 40));
    }
  }
  analyzing = false;
}

function updateCard(s) {
  if (!s.el) return;
  const meta = s.el.querySelector('[data-meta]');
  const diff = s.el.querySelector('[data-diff]');
  if (s.status === 'ready') {
    meta.textContent = `${fmtTime(s.duration)} · ${s.noteCount} NOTES · ${s.density.toFixed(2)}/S`;
    diff.textContent = s.difficulty;
    diff.className = 'card-diff d-' + s.difficulty.toLowerCase();
  } else if (s.status === 'analyzing') {
    meta.textContent = 'ANALYZING WAVEFORM…';
    diff.textContent = '···';
    diff.className = 'card-diff d-pending';
  } else if (s.status === 'error') {
    meta.textContent = 'UNAVAILABLE';
    diff.textContent = '—';
    diff.className = 'card-diff d-pending';
  } else {
    meta.textContent = 'QUEUED';
    diff.textContent = '—';
    diff.className = 'card-diff d-pending';
  }
}

function updateSongCount() {
  const ready = songs.filter(s => s.status === 'ready').length;
  $('#songCount').textContent = songs.length ? `  ${ready}/${songs.length}` : '';
}

/* ---------- preview ---------- */
let previewAudio = null, previewCard = null;

function playPreview(song, el) {
  if (previewCard === el) return;
  stopPreview();
  previewCard = el;
  el.classList.add('previewing');

  if (titleAudio && !titleAudio.paused) fadeAudio(titleAudio, 0.06, 320);

  try {
    const a = new Audio(song.url);
    a.volume = 0;
    a.preload = 'auto';
    a.addEventListener('loadedmetadata', () => {
      try {
        const d = a.duration;
        if (isFinite(d) && d > 8) a.currentTime = Math.min(d * 0.22, 32);
      } catch (e) {}
    });
    previewAudio = a;
    a.play().then(() => fadeAudio(a, 0.5, 450)).catch(() => {});
  } catch (e) {}
}

function stopPreview() {
  if (previewAudio) {
    try { previewAudio.pause(); } catch (e) {}
    previewAudio.src = '';
    previewAudio = null;
  }
  if (previewCard) { previewCard.classList.remove('previewing'); previewCard = null; }
  if (titleAudio && !titleAudio.paused && titleWanted) fadeAudio(titleAudio, TITLE_VOL, 600);
}

/* ---------- rendering ---------- */
let touchPreviewId = null;
let suppressClick = false;

function renderSongs() {
  const list = $('#songList');
  list.innerHTML = '';

  if (!songs.length) {
    const d = document.createElement('div');
    d.className = 'empty-note';
    d.innerHTML =
      'No tracks found.<br><br>' +
      'Add <b>.mp3</b> files to the <b>/music</b> folder and reload — ' +
      'or tap <b>Add Folder</b> / <b>Add Files</b> to import them directly. ' +
      'Imported files are saved on this device.';
    list.appendChild(d);
    updateSongCount();
    return;
  }

  songs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="vinyl"></div>' +
      '<div class="card-info">' +
        '<div class="card-title">' + esc(s.title) + '</div>' +
        '<div class="card-meta" data-meta>QUEUED</div>' +
      '</div>' +
      '<div class="card-diff d-pending" data-diff>—</div>';

    el.addEventListener('pointerenter', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      playPreview(s, el);
    });
    el.addEventListener('pointerleave', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopPreview();
    });
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      if (touchPreviewId !== s.id) {
        touchPreviewId = s.id;
        playPreview(s, el);
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 450);
      }
    });
    el.addEventListener('click', () => {
      if (suppressClick) return;
      startGame(s);
    });

    list.appendChild(el);
    s.el = el;
    updateCard(s);
  });
  updateSongCount();
}

/* ============================================================
   SCREEN ROUTING
   ============================================================ */
function showScreen(id) {
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  titleWanted = (id === 'menu');
  if (titleAudio) fadeAudio(titleAudio, titleWanted ? TITLE_VOL : 0, 500);
  if (id === 'menu') setTimeout(resizeCanvas, 40);
}

/* ============================================================
   GAME
   ============================================================ */
const cv = $('#cv');
const ctx = cv.getContext('2d', { alpha: false });

const AUDIO_OFFSET = 0.055;
const MISS_WINDOW = 0.16;
const PERFECT_WINDOW = 0.055;
const GOOD_WINDOW = 0.115;

const game = {
  running: false,
  song: null,
  audio: null,
  notes: [],
  approach: 1.6,
  score: 0,
  combo: 0,
  maxCombo: 0,
  health: 100,
  perfect: 0,
  good: 0,
  miss: 0,
  laneFlash: [0, 0, 0, 0],
  popups: [],
  failed: false,
  finished: false,
  raf: 0,
  beatPulse: 0,
  lastBeatT: -1
};

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 220));

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function startGame(song) {
  stopPreview();
  showScreen('game');
  titleWanted = false;
  if (titleAudio) fadeAudio(titleAudio, 0, 300);

  $('#ghTitle').textContent = song.title.toUpperCase();
  $('#ghScore').textContent = '0';
  $('#healthFill').style.width = '100%';
  $('#healthWrap').classList.remove('low');
  $('#resultOverlay').classList.remove('show');

  if (!song.chart) {
    $('#ghTitle').textContent = 'ANALYZING…';
    toast('Analyzing ' + song.title);
    await ensureAnalysis(song);
  }
  if (!song.chart || !song.chart.notes.length) {
    toast('No beat data for this track', true);
    showScreen('songs');
    return;
  }

  const cfg = DIFF_CFG[song.difficulty] || DIFF_CFG.NORMAL;

  game.song = song;
  game.notes = song.chart.notes.map(n => ({ t: n.t, lane: n.lane, hit: false, missed: false }));
  game.approach = cfg.approach;
  game.score = 0;
  game.combo = 0;
  game.maxCombo = 0;
  game.health = 100;
  game.perfect = 0;
  game.good = 0;
  game.miss = 0;
  game.laneFlash = [0, 0, 0, 0];
  game.popups = [];
  game.failed = false;
  game.finished = false;
  game.beatPulse = 0;
  game.lastBeatT = -1;

  resizeCanvas();

  const a = new Audio(song.url);
  a.volume = 0.92;
  a.preload = 'auto';
  game.audio = a;

  a.addEventListener('ended', () => {
    if (!game.finished) setTimeout(finishGame, 500);
  });

  try { await a.play(); }
  catch (e) {
    const retry = () => { a.play().catch(() => {}); window.removeEventListener('pointerdown', retry); };
    window.addEventListener('pointerdown', retry);
  }

  $('#ghTitle').textContent = song.title.toUpperCase();

  game.running = true;
  cancelAnimationFrame(game.raf);
  game.raf = requestAnimationFrame(gameLoop);
}

function gameTime() {
  const a = game.audio;
  if (!a) return 0;
  return a.currentTime - AUDIO_OFFSET;
}

function addPopup(lane, text, color) {
  game.popups.push({ lane, text, color, life: 1 });
}

function hitLane(lane) {
  if (!game.running || game.finished) return;
  const t = gameTime();
  game.laneFlash[lane] = 1;

  let best = null, bestDt = 1e9;
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed || n.lane !== lane) continue;
    const dt = Math.abs(n.t - t);
    if (dt < bestDt) { bestDt = dt; best = n; }
    if (n.t - t > MISS_WINDOW + 0.1) break;
  }

  if (best && bestDt <= MISS_WINDOW) {
    best.hit = true;
    let gain, label, isPerfect = false;
    if (bestDt <= PERFECT_WINDOW) {
      gain = 300; label = 'PERFECT'; isPerfect = true;
      game.perfect++; game.health = clamp(game.health + 1.6, 0, 100);
    } else if (bestDt <= GOOD_WINDOW) {
      gain = 160; label = 'GOOD';
      game.good++; game.health = clamp(game.health + 0.9, 0, 100);
    } else {
      gain = 70; label = 'GOOD';
      game.good++; game.health = clamp(game.health + 0.4, 0, 100);
    }

    game.combo++;
    if (game.combo > game.maxCombo) game.maxCombo = game.combo;
    const mult = 1 + Math.min(game.combo, 120) / 120 * 0.6;
    game.score += Math.round(gain * mult);
    addPopup(lane, label, isPerfect ? '#ffffff' : '#ff6b81');
    updateHud();
  } else {
    game.health = clamp(game.health - 0.6, 0, 100);
    updateHud();
  }
}

function onMiss(note) {
  game.miss++;
  game.combo = 0;
  game.health = clamp(game.health - 8.5, 0, 100);
  addPopup(note.lane, 'MISS', '#8c0f22');
  updateHud();
  if (game.health <= 0 && !game.failed) {
    game.failed = true;
    finishGame();
  }
}

function updateHud() {
  $('#ghScore').textContent = game.score.toLocaleString();
  $('#healthFill').style.width = game.health.toFixed(1) + '%';
  $('#healthWrap').classList.toggle('low', game.health < 35);
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const lane = clamp(Math.floor(x / (rect.width / 4)), 0, 3);
  hitLane(lane);
}, { passive: false });

const KEYMAP = { d: 0, f: 1, j: 2, k: 3 };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in KEYMAP && !e.repeat) hitLane(KEYMAP[k]);
});

/* ---------- loop ---------- */
function gameLoop() {
  if (!game.running) return;
  const a = game.audio;
  if (!a) return;

  const t = gameTime();

  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed) continue;
    if (n.t - t > game.approach + 0.5) break;
    if (t > n.t + MISS_WINDOW) { n.missed = true; onMiss(n); }
  }

  drawGame(t);
  game.raf = requestAnimationFrame(gameLoop);
}

function drawGame(t) {
  const W = cv.clientWidth, H = cv.clientHeight;
  const laneW = W / 4;
  const hitY = H * 0.80;
  const pps = (hitY + 140) / game.approach;

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a0e');
  bg.addColorStop(0.55, '#07070a');
  bg.addColorStop(1, '#0d0308');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // beat pulse
  game.beatPulse = Math.max(0, game.beatPulse - 0.045);
  if (game.beatPulse > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, Math.max(W, H) * 0.9);
    g.addColorStop(0, 'rgba(255,31,61,' + (0.28 * game.beatPulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // lanes
  for (let i = 0; i < 4; i++) {
    const x = i * laneW;
    const f = game.laneFlash[i];
    if (f > 0.01) {
      const g = ctx.createLinearGradient(0, hitY - 420, 0, H);
      g.addColorStop(0, 'rgba(255,31,61,0)');
      g.addColorStop(1, 'rgba(255,31,61,' + (0.32 * f).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(x, hitY - 420, laneW, H - hitY + 420);
      game.laneFlash[i] = Math.max(0, f - 0.055);
    }
    ctx.fillStyle = 'rgba(255,31,61,0.075)';
    ctx.fillRect(x, 0, 1, H);
  }
  ctx.fillStyle = 'rgba(255,31,61,0.075)';
  ctx.fillRect(W - 1, 0, 1, H);

  // hit line
  ctx.save();
  ctx.shadowColor = 'rgba(255,31,61,0.9)';
  ctx.shadowBlur = 24;
  ctx.fillStyle = 'rgba(255,31,61,0.95)';
  ctx.fillRect(0, hitY - 1.5, W, 3);
  ctx.restore();

  const hg = ctx.createLinearGradient(0, hitY - 130, 0, hitY);
  hg.addColorStop(0, 'rgba(255,31,61,0)');
  hg.addColorStop(1, 'rgba(255,31,61,0.16)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, hitY - 130, W, 130);

  // receptors
  for (let i = 0; i < 4; i++) {
    const x = i * laneW + 8;
    const w = laneW - 16;
    ctx.strokeStyle = 'rgba(255,31,61,0.38)';
    ctx.lineWidth = 1.5;
    roundRect(x, hitY - 17, w, 34, 6);
    ctx.stroke();
  }

  // notes
  const noteH = 30;
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed) continue;
    const dt = n.t - t;
    if (dt > game.approach + 0.25) break;
    if (dt < -0.35) continue;
    const y = hitY - dt * pps;
    const x = n.lane * laneW + 8;
    const w = laneW - 16;

    // trail
    if (dt < game.approach * 0.92) {
      const trailH = 60;
      const tg = ctx.createLinearGradient(0, y - trailH, 0, y);
      tg.addColorStop(0, 'rgba(255,31,61,0)');
      tg.addColorStop(1, 'rgba(255,31,61,0.35)');
      ctx.fillStyle = tg;
      ctx.fillRect(x + 2, y - trailH, w - 4, trailH);
    }

    const g = ctx.createLinearGradient(0, y - noteH / 2, 0, y + noteH / 2);
    g.addColorStop(0, '#ff5a70');
    g.addColorStop(0.45, '#ff1f3d');
    g.addColorStop(1, '#8c0f22');

    ctx.save();
    ctx.shadowColor = 'rgba(255,31,61,0.9)';
    ctx.shadowBlur = 20;
    roundRect(x, y - noteH / 2, w, noteH, 6);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(x + 3, y - noteH / 2 + 3, w - 6, 3, 2);
    ctx.fill();
    ctx.restore();
  }

  // popups
  ctx.textAlign = 'center';
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.life -= 0.028;
    if (p.life <= 0) { game.popups.splice(i, 1); continue; }
    const cx = p.lane * laneW + laneW / 2;
    const y = hitY - 74 - (1 - p.life) * 44;
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.font = '800 15px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillText(p.text, cx, y);
    ctx.globalAlpha = 1;
  }

  // combo
  if (game.combo > 2) {
    ctx.save();
    ctx.globalAlpha = 0.94;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,31,61,0.95)';
    ctx.shadowBlur = 34;
    ctx.font = '900 ' + Math.round(Math.min(W, H) * 0.11) + 'px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillText(String(game.combo), W / 2, H * 0.46);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#ff1f3d';
    ctx.font = '800 12px -apple-system, Helvetica, Arial, sans-serif';
    ctx.fillText('COMBO', W / 2, H * 0.46 + 22);
    ctx.restore();
  }

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function finishGame() {
  if (game.finished) return;
  game.finished = true;
  game.running = false;
  cancelAnimationFrame(game.raf);

  const a = game.audio;
  if (a) {
    fadeAudio(a, 0, 900);
    setTimeout(() => { try { a.pause(); } catch (e) {} }, 950);
  }

  const total = game.perfect + game.good + game.miss;
  const acc = total > 0 ? (game.perfect * 300 + game.good * 160) / (total * 300) : 0;

  let grade;
  if (game.failed) grade = 'F';
  else if (acc >= 0.97) grade = 'S';
  else if (acc >= 0.90) grade = 'A';
  else if (acc >= 0.80) grade = 'B';
  else if (acc >= 0.66) grade = 'C';
  else grade = 'D';

  $('#resGrade').textContent = grade;
  $('#resVerdict').textContent = game.failed ? 'Signal Lost' : (grade === 'S' ? 'Flawless' : 'Track Cleared');
  $('#resTrack').textContent = game.song ? game.song.title.toUpperCase() : '—';
  $('#resScore').textContent = game.score.toLocaleString();
  $('#resPerfect').textContent = game.perfect;
  $('#resGood').textContent = game.good;
  $('#resMiss').textContent = game.miss;
  $('#resCombo').textContent = game.maxCombo;

  $('#resultOverlay').classList.add('show');
}

function quitGame() {
  game.running = false;
  game.finished = true;
  cancelAnimationFrame(game.raf);
  if (game.audio) { try { game.audio.pause(); } catch (e) {} game.audio = null; }
  $('#resultOverlay').classList.remove('show');
  showScreen('songs');
}

/* ============================================================
   IMPORT
   ============================================================ */
function addSongsToLibrary(fileList) {
  let added = 0;
  for (const f of fileList) {
    if (!AUDIO_RE.test(f.name)) continue;
    const key = f.name.toLowerCase();
    if (songs.some(s => s.title.toLowerCase() === prettyName(f.name).toLowerCase() && s.source === 'imported')) continue;

    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const song = {
      id,
      title: prettyName(f.name),
      url: URL.createObjectURL(f),
      status: 'pending',
      source: 'imported',
      fileName: f.name
    };
    songs.push(song);
    // persist
    idbPut('music', { id, name: f.name, blob: f, added: Date.now() });
    added++;
  }
  if (added) {
    renderSongs();
    analyzeQueue();
    toast(added + (added === 1 ? ' track added' : ' tracks added'));
  } else {
    toast('No audio files found in selection', true);
  }
}

/* ---------- asset setup (menu bg + title music + icon) ---------- */
let assetInput = null;
function setupAssets() {
  if (!assetInput) {
    assetInput = document.createElement('input');
    assetInput.type = 'file';
    assetInput.multiple = true;
    assetInput.accept = 'image/*,audio/*';
    assetInput.style.display = 'none';
    document.body.appendChild(assetInput);

    assetInput.addEventListener('change', async e => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;

      let bgFile = null, musicFile = null, iconFile = null;
      for (const f of files) {
        if (IMAGE_RE.test(f.name) || (f.type && f.type.startsWith('image/'))) {
          if (/icon|logo/i.test(f.name)) iconFile = iconFile || f;
          else bgFile = bgFile || f;
          if (!iconFile && /icon|logo/i.test(f.name)) iconFile = f;
        }
        if (AUDIO_RE.test(f.name) || (f.type && f.type.startsWith('audio/'))) {
          musicFile = musicFile || f;
        }
      }

      if (bgFile) {
        await idbPut('assets', { id: 'bg', kind: 'bg', name: bgFile.name, blob: bgFile });
        applyBg(URL.createObjectURL(bgFile));
        toast('Menu background updated');
      }
      if (musicFile) {
        await idbPut('assets', { id: 'titleMusic', kind: 'titleMusic', name: musicFile.name, blob: musicFile });
        if (titleAudio) { try { titleAudio.pause(); } catch (e) {} titleAudio = null; titleSrcNode = null; titleAnalyser = null; }
        startTitleMusic(URL.createObjectURL(musicFile));
        toast('Menu music updated');
      }
      if (iconFile) {
        await idbPut('assets', { id: 'icon', kind: 'icon', name: iconFile.name, blob: iconFile });
        applyIcon(URL.createObjectURL(iconFile));
        toast('Icon updated');
      }
      if (!bgFile && !musicFile && !iconFile) {
        toast('No usable bg image or audio found', true);
      }
    });
  }
  assetInput.click();
}
$('#setupAssetsBtn').addEventListener('click', setupAssets);

function applyBg(url) {
  const el = $('#menuBg');
  if (!url) { el.style.backgroundImage = 'none'; return; }
  el.style.backgroundImage = "url('" + url.replace(/'/g, "\\'") + "')";
}

function applyIcon(url) {
  const el = $('#menuIcon');
  if (!url) { el.classList.add('hidden'); return; }
  el.src = url;
  el.classList.remove('hidden');
  el.onerror = () => el.classList.add('hidden');
}

/* unlock audio on first interaction */
let unlocked = false;
function unlock() {
  if (unlocked) return;
  unlocked = true;
  actx();
  tryPlayTitle();
  $('#tapHint').classList.add('hidden');
}
window.addEventListener('pointerdown', unlock, { passive: true });
window.addEventListener('keydown', unlock);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (game.running && game.audio) { try { game.audio.pause(); } catch (e) {} }
    if (titleAudio && !titleAudio.paused) { try { titleAudio.pause(); } catch (e) {} }
  } else {
    if (game.running && game.audio && game.audio.paused && !game.finished) {
      game.audio.play().catch(() => {});
    }
    if (titleWanted && titleAudio && titleAudio.paused) {
      titleAudio.play().catch(() => {});
    }
    if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  }
});

/* prevent rubber-band scrolling outside scroll lists */
document.addEventListener('touchmove', e => {
  if (e.target.closest && e.target.closest('.song-list')) return;
  e.preventDefault();
}, { passive: false });

/* ============================================================
   BOOT
   ============================================================ */
async function loadStoredMusic() {
  const stored = await idbAll('music');
  const seen = new Set();
  for (const f of stored) {
    if (!f.blob) continue;
    const name = f.name || 'track.mp3';
    const key = name.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    songs.push({
      id: 'idb_' + f.id,
      title: prettyName(name),
      url: URL.createObjectURL(f.blob),
      status: 'pending',
      source: 'imported',
      fileName: name
    });
  }
}

async function loadFolderMusic() {
  // Try directory discovery (works on http server)
  let names = await listDirNames('music/', AUDIO_RE);

  // Common fallbacks
  if (!names.length) {
    const common = ['track1.mp3','track01.mp3','song1.mp3','song01.mp3','music1.mp3','01.mp3'];
    for (const c of common) {
      if (await probe('music/' + c)) names.push(c);
    }
  }

  const seen = new Set(songs.map(s => s.title.toLowerCase()));
  for (const n of names) {
    const key = prettyName(n).toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    songs.push({
      id: 'fs_' + songs.length + '_' + Math.random().toString(36).slice(2, 6),
      title: prettyName(n),
      url: 'music/' + encodeURIComponent(n),
      status: 'pending',
      source: 'folder',
      fileName: n
    });
  }
}

async function loadMainAssets() {
  // 1. IndexedDB (user imported)
  const stored = await idbAll('assets');
  let bgUrl = null, musicUrl = null, iconUrl = null;
  for (const a of stored) {
    if (!a.blob) continue;
    if (a.kind === 'bg' && !bgUrl) bgUrl = URL.createObjectURL(a.blob);
    if (a.kind === 'titleMusic' && !musicUrl) musicUrl = URL.createObjectURL(a.blob);
    if (a.kind === 'icon' && !iconUrl) iconUrl = URL.createObjectURL(a.blob);
  }

  // 2. bg.png and common variants
  if (!bgUrl) {
    const bgCandidates = ['bg.png','bg.jpg','bg.jpeg','bg.webp','background.png','background.jpg','background.webp'];
    for (const c of bgCandidates) {
      if (await probe('mainassets/' + c)) { bgUrl = 'mainassets/' + c; break; }
    }
  }

  // 3. icon
  if (!iconUrl) {
    const iconCandidates = ['icon.png','icon.jpg','icon.webp','logo.png','logo.jpg'];
    for (const c of iconCandidates) {
      if (await probe('mainassets/' + c)) { iconUrl = 'mainassets/' + c; break; }
    }
  }

  // 4. title music: directory discovery first
  if (!musicUrl) {
    const names = await listDirNames('mainassets/', AUDIO_RE);
    if (names.length) musicUrl = 'mainassets/' + encodeURIComponent(names[0]);
  }
  if (!musicUrl) {
    const musicCandidates = ['theme.mp3','title.mp3','menu.mp3','main.mp3','bgm.mp3','music.mp3','title.m4a','theme.m4a'];
    for (const c of musicCandidates) {
      if (await probe('mainassets/' + c)) { musicUrl = 'mainassets/' + c; break; }
    }
  }

  applyBg(bgUrl);
  applyIcon(iconUrl);
  if (musicUrl) startTitleMusic(musicUrl);

  return { bgUrl, musicUrl, iconUrl };
}

async function boot() {
  buildEq();
  eqLoop();

  // load assets in parallel
  loadMainAssets().catch(e => console.warn('assets', e));

  // load music: stored first, then folder discovery
  await loadStoredMusic();
  await loadFolderMusic();

  if (!songs.length) {
    try {
      const built = await buildBuiltinSong();
      songs.push(built);
    } catch (e) {
      console.warn('built-in track failed', e);
    }
  }

  renderSongs();
  analyzeQueue();

  // ready state for menu animation
  requestAnimationFrame(() => {
    setTimeout(() => $('#menu').classList.add('ready'), 80);
  });
}

// Start
boot();
})();
</script>
