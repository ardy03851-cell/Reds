<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#08080a" />
<title>PULSE // RED</title>
<link rel="apple-touch-icon" href="mainassets/icon.svg" />
<link rel="icon" href="mainassets/icon.svg" />
<style>
/* ============================================================
   PULSE // RED  —  stylesheet
   ============================================================ */
:root{
  --red:#ff1f3d;
  --red-soft:#ff5f74;
  --red-deep:#8c0f22;
  --bg:#07070a;
  --panel:#0e0e12;
  --text:#eaeaee;
  --muted:#6a6a74;
  --line:rgba(255,31,61,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}

.screen{
  position:fixed;inset:0;opacity:0;pointer-events:none;
  transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
  will-change:opacity,transform;
}
.screen.active{opacity:1;pointer-events:auto;}

/* ============================================================
   MAIN MENU
   ============================================================ */
#menu{background:#050507;}
#menuBg{
  position:absolute;inset:0;
  background-image:url('mainassets/IMG_2105.png');
  background-size:cover;background-position:center;
  background-color:#0a0407;
  transform:scale(1.06);
  filter:saturate(.75) contrast(1.08) brightness(.72);
}
#menu .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 15% 50%, rgba(255,31,61,.14) 0%, rgba(0,0,0,0) 55%),
    linear-gradient(90deg, rgba(5,5,8,.96) 0%, rgba(5,5,8,.72) 38%, rgba(5,5,8,.35) 62%, rgba(5,5,8,.85) 100%),
    linear-gradient(180deg, rgba(5,5,8,.7) 0%, rgba(5,5,8,0) 30%, rgba(5,5,8,.9) 100%);
}
#menu .grain{
  position:absolute;inset:0;opacity:.06;pointer-events:none;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 1px, transparent 1px 3px);
}
.menu-inner{
  position:absolute;inset:0;display:flex;align-items:center;
  padding:0 max(40px,6vw);
}
.title-block{max-width:640px;position:relative;}
.side-rule{
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--red),transparent);
  opacity:.7;
  margin-left:calc(-1 * max(20px,2.4vw));
}
.menu-icon{
  width:54px;height:54px;object-fit:contain;display:block;margin-bottom:22px;
  filter:drop-shadow(0 0 18px rgba(255,31,61,.55));
}
.menu-icon.hidden{display:none;}
.game-title{
  font-size:clamp(46px,8.6vw,124px);
  line-height:.86;font-weight:900;letter-spacing:-.045em;text-transform:uppercase;
  text-shadow:0 0 60px rgba(255,31,61,.35);
}
.game-title i{color:var(--red);font-style:normal;text-shadow:0 0 28px rgba(255,31,61,.9);}
.tagline{
  margin-top:22px;font-size:11px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;
}
.play-btn{
  margin-top:44px;position:relative;overflow:hidden;
  border:1px solid rgba(255,31,61,.45);
  padding:19px 62px;font-size:14px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;
  transition:border-color .45s cubic-bezier(.16,1,.3,1), box-shadow .45s, transform .25s;
}
.play-btn span{position:relative;z-index:2;}
.play-btn::before{
  content:'';position:absolute;inset:0;background:var(--red);
  transform:translateX(-101%);
  transition:transform .5s cubic-bezier(.16,1,.3,1);
}
.play-btn:hover::before,.play-btn:active::before{transform:translateX(0);}
.play-btn:hover{border-color:var(--red);box-shadow:0 0 44px rgba(255,31,61,.4);}
.play-btn:active{transform:scale(.97);}

.eq{
  position:absolute;left:0;right:0;bottom:0;height:110px;
  display:flex;align-items:flex-end;gap:3px;
  opacity:.8;pointer-events:none;
  mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
}
.eq i{
  flex:1 1 0;height:2px;display:block;
  background:linear-gradient(to top, rgba(255,31,61,.95), rgba(255,31,61,.08));
  will-change:height;
}
.hint{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.42em;color:rgba(255,255,255,.4);
  text-transform:uppercase;transition:opacity .6s;pointer-events:none;
}
.hint.hidden{opacity:0;}

/* ============================================================
   SONG SELECT
   ============================================================ */
#songs{
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,31,61,.13) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#0a0508 0%, #07070a 45%, #050506 100%);
  display:flex;flex-direction:column;
}
#songs:not(.active){transform:translateX(5%);}
#menu:not(.active){transform:translateX(-3%) scale(.985);}
.songs-header{
  display:flex;align-items:center;gap:24px;
  padding:26px max(28px,4vw);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
  background:rgba(4,4,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.songs-header h2{
  font-size:13px;letter-spacing:.46em;text-transform:uppercase;font-weight:800;
  color:#fff;
}
.songs-header h2::after{content:' / choose a frequency to follow';color:rgba(255,255,255,.2);font-weight:500;letter-spacing:.18em;margin-left:12px;}
.ghost-btn{
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;
  color:var(--muted);border:1px solid rgba(255,255,255,.1);
  padding:11px 20px;transition:.3s;
}
.ghost-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.08);}
.ghost-btn.spacer{margin-left:auto;}
.song-list{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px max(28px,4vw) 80px;
  display:flex;flex-direction:column;gap:14px;
  touch-action:pan-y;
}
.song-list::-webkit-scrollbar{width:6px;}
.song-list::-webkit-scrollbar-thumb{background:rgba(255,31,61,.35);border-radius:3px;}

.card{
  position:relative;height:128px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(105deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  display:flex;align-items:center;
  padding:0 28px;overflow:hidden;cursor:pointer;
  transition:border-color .35s, background .35s, transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
}
.card:hover,.card.previewing{
  border-color:rgba(255,31,61,.6);
  background:linear-gradient(90deg, rgba(255,31,61,.11), rgba(255,31,61,.015));
  transform:translateX(10px) rotateX(1deg);
  box-shadow:0 0 40px rgba(255,31,61,.12), inset 0 0 60px rgba(255,31,61,.05);
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);transform:scaleY(0);transform-origin:center;transition:transform .35s cubic-bezier(.16,1,.3,1);}
.card:hover::before,.card.previewing::before{transform:scaleY(1);}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,31,61,.07) 48%,transparent 100%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.16,1,.3,1);pointer-events:none;}
.card:hover::after,.card.previewing::after{transform:translateX(120%);}
.track-no{position:relative;z-index:2;width:34px;margin-right:18px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.24);font-variant-numeric:tabular-nums;}
.card-info{position:relative;z-index:2;max-width:55%;min-width:0;}
.card-title{
  font-size:clamp(15px,2.1vw,21px);font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 20px rgba(0,0,0,.9);
}
.card-meta{
  margin-top:8px;font-size:10px;letter-spacing:.18em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-diff{
  position:relative;z-index:2;margin-left:auto;
  font-size:11px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;
  padding:9px 18px;border:1px solid rgba(255,255,255,.14);color:var(--muted);
  transition:.3s;flex:0 0 auto;
}
.card-diff.d-easy{color:#9a9aa4;border-color:rgba(255,255,255,.2);}
.card-diff.d-normal{color:var(--red-soft);border-color:rgba(255,95,116,.5);}
.card-diff.d-hard{color:var(--red);border-color:rgba(255,31,61,.6);box-shadow:0 0 22px rgba(255,31,61,.2);}
.card-diff.d-extreme{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 0 30px rgba(255,31,61,.6);}

.vinyl{
  position:absolute;left:50%;top:50%;width:104px;height:104px;
  margin:-52px 0 0 -52px;border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, #191920 0 2px, #0b0b0f 2px 4px),
    #0d0d11;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 10px 40px rgba(0,0,0,.9);
  opacity:.22;z-index:1;
  transition:opacity .45s ease, box-shadow .45s ease;
}
.vinyl::after{
  content:'';position:absolute;inset:31%;border-radius:50%;
  background:radial-gradient(circle, var(--red) 0 38%, #64091a 39% 100%);
  box-shadow:0 0 16px rgba(255,31,61,.55);
}
.vinyl::before{
  content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#07070a;z-index:3;
}
.card:hover .vinyl,.card.previewing .vinyl{
  opacity:.95;
  animation:spin 1.7s linear infinite;
  box-shadow:inset 0 0 0 1px rgba(255,31,61,.55), 0 0 46px rgba(255,31,61,.45);
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.empty-note{
  padding:60px 4px;color:var(--muted);font-size:12px;letter-spacing:.28em;text-transform:uppercase;line-height:2.2;
}

/* ============================================================
   GAME
   ============================================================ */
#game{background:#050506;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.game-hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:max(18px,3vh) max(22px,3vw);
  pointer-events:none;
}
.gh-title{
  font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);font-weight:700;
  max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.health{
  margin-top:12px;width:min(240px,34vw);height:4px;background:rgba(255,255,255,.08);
  overflow:hidden;
}
.health-fill{
  height:100%;width:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));
  transition:width .18s linear, background .4s;
  box-shadow:0 0 16px rgba(255,31,61,.8);
}
.health.low .health-fill{background:linear-gradient(90deg,#ff1f3d,#ff6b3d);}
.gh-right{display:flex;align-items:center;gap:22px;pointer-events:auto;}
.gh-score{
  font-size:clamp(20px,3.2vw,32px);font-weight:900;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,31,61,.5);
}
.gh-combo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(48px,10vw,96px);font-weight:900;color:#fff;
  text-shadow:0 0 40px rgba(255,31,61,.9);
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.gh-combo.show{opacity:.9;}
.gh-combo small{display:block;font-size:11px;letter-spacing:.4em;color:var(--red);margin-top:6px;text-align:center;}
.gh-quit{
  pointer-events:auto;width:40px;height:40px;border:1px solid rgba(255,255,255,.12);
  color:var(--muted);font-size:16px;transition:.3s;line-height:1;
}
.gh-quit:hover{border-color:var(--red);color:#fff;background:rgba(255,31,61,.12);}

/* results */
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,6,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.result-panel{
  width:min(560px,88vw);border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,31,61,.06), rgba(0,0,0,0));
  padding:44px 44px 36px;text-align:center;
}
.result-grade{
  font-size:clamp(64px,12vw,110px);font-weight:900;line-height:1;letter-spacing:-.04em;
  color:var(--red);text-shadow:0 0 60px rgba(255,31,61,.75);
}
.result-title{
  margin-top:8px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);
}
.result-track{
  margin-top:26px;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.result-score{
  margin-top:18px;font-size:clamp(30px,5vw,44px);font-weight:900;font-variant-numeric:tabular-nums;
}
.result-grid{
  margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  border-top:1px solid var(--line);padding-top:24px;
}
.result-grid div span{display:block;font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;}
.result-grid div b{display:block;margin-top:8px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
.result-actions{margin-top:34px;display:flex;gap:14px;justify-content:center;}
.act-btn{
  border:1px solid rgba(255,255,255,.14);padding:15px 34px;
  font-size:11px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
  transition:.3s;color:var(--muted);
}
.act-btn:hover{color:#fff;border-color:var(--red);background:rgba(255,31,61,.14);}
.act-btn.primary{border-color:var(--red);color:#fff;background:rgba(255,31,61,.16);}
.act-btn.primary:hover{background:var(--red);}

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.75) .5px,transparent .7px);
  background-size:5px 5px;mix-blend-mode:screen;
}
#menuBg{transition:filter 900ms cubic-bezier(.16,1,.3,1),transform 1400ms cubic-bezier(.16,1,.3,1);}
#menu.soft-focus #menuBg{filter:saturate(.55) contrast(1.02) brightness(.62) blur(5px);transform:scale(1.09);}
#menu .veil{transition:opacity .8s ease;}
.menu-inner{transition:filter .7s ease,opacity .7s ease;}
#menu.soft-focus .menu-inner{filter:blur(1px);opacity:.78;}

@media (max-width:700px){
  .songs-header h2::after{display:none;}
  .card{height:112px;padding:0 18px;}
  .card-diff{padding:7px 10px;font-size:9px;letter-spacing:.16em;}
}
</style>
</head>
<body>

<!-- ========================= MAIN MENU ========================= -->
<section id="menu" class="screen active">
  <div id="menuBg"></div>
  <div class="veil"></div>
  <div class="grain"></div>

  <div class="menu-inner">
    <div class="title-block">
      <div class="side-rule"></div>
      <img id="menuIcon" class="menu-icon" src="mainassets/icon.svg" alt="" />
      <h1 class="game-title">PULSE<br><i>//</i>RED</h1>
      <p class="tagline">Rhythm Reactor &nbsp;·&nbsp; v3.0</p>
      <button id="playBtn" class="play-btn"><span>Play</span></button>
    </div>
  </div>

  <div class="eq" id="eq"></div>
  <div class="hint" id="tapHint">Tap anywhere to enable audio</div>
</section>

<!-- ========================= SONG SELECT ========================= -->
<section id="songs" class="screen">
  <header class="songs-header">
    <button id="backBtn" class="ghost-btn">← Back</button>
    <h2>Select Track</h2>
    <button id="importBtn" class="ghost-btn spacer">Import</button>
    <input type="file" id="fileInput" accept="audio/*" multiple hidden />
  </header>
  <div class="song-list" id="songList"></div>
</section>

<!-- ========================= GAME ========================= -->
<section id="game" class="screen">
  <canvas id="cv"></canvas>
  <div class="game-hud">
    <div>
      <div class="gh-title" id="ghTitle">—</div>
      <div class="health" id="healthWrap"><div class="health-fill" id="healthFill"></div></div>
    </div>
    <div class="gh-right">
      <div class="gh-score" id="ghScore">0</div>
      <button class="gh-quit" id="quitBtn">✕</button>
    </div>
  </div>
  <div class="gh-combo" id="ghCombo">0<small id="ghComboLabel">CHAIN</small></div>

  <div class="overlay" id="resultOverlay">
    <div class="result-panel">
      <div class="result-grade" id="resGrade">S</div>
      <div class="result-title" id="resVerdict">Cleared</div>
      <div class="result-track" id="resTrack">—</div>
      <div class="result-score" id="resScore">0</div>
      <div class="result-grid">
        <div><span>Perfect</span><b id="resPerfect">0</b></div>
        <div><span>Good</span><b id="resGood">0</b></div>
        <div><span>Miss</span><b id="resMiss">0</b></div>
        <div><span>Max Combo</span><b id="resCombo">0</b></div>
      </div>
      <div class="result-actions">
        <button class="act-btn" id="resBack">Tracks</button>
        <button class="act-btn primary" id="resRetry">Retry</button>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const AUDIO_RE = /\.(mp3|m4a|aac|ogg|oga|wav|flac)$/i;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = s => {
  if (!isFinite(s) || s <= 0) return '--:--';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
};

/* ============================================================
   AUDIO CONTEXT
   ============================================================ */
let AC = null;
function actx() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AC = new Ctx();
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}

function fadeAudio(a, to, ms) {
  if (!a) return;
  if (a._fadeRaf) cancelAnimationFrame(a._fadeRaf);
  const from = a.volume, start = performance.now();
  const step = () => {
    const k = clamp((performance.now() - start) / ms, 0, 1);
    try { a.volume = clamp(from + (to - from) * k, 0, 1); } catch (e) {}
    if (k < 1) a._fadeRaf = requestAnimationFrame(step);
    else a._fadeRaf = 0;
  };
  a._fadeRaf = requestAnimationFrame(step);
}

/* ============================================================
   FOLDER SCANNING
   ============================================================ */
const ASSET_FALLBACKS = {
  'mainassets/': ['Y2Mate.is - Third Rail.mp3'],
  'music/': [
    'Y2Mate.is - MV ABM -  Signaling   .mp3',
    'Y2Mate.is - Rose feat Ember Amane.mp3'
  ]
};

function assetUrl(dir, name) {
  return dir + encodeURIComponent(String(name));
}

async function probe(url) {
  try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.ok; }
  catch (e) { return false; }
}

async function listDir(dir) {
  try {
    const r = await fetch(dir + 'manifest.json', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j && j.files) || [];
      const out = arr
        .map(f => (typeof f === 'string' ? f : (f && (f.file || f.name)) || ''))
        .filter(f => AUDIO_RE.test(f));
      if (out.length) return Array.from(new Set(out));
    }
  } catch (e) {}

  try {
    const r = await fetch(dir, { cache: 'no-store' });
    if (r.ok) {
      const txt = await r.text();
      const names = [];
      const re = /href\s*=\s*["']([^"']+)["']/gi;
      let m;
      while ((m = re.exec(txt))) {
        let h = m[1];
        if (/^(https?:)?\/\//i.test(h) || h[0] === '?' || h[0] === '#') continue;
        h = h.split('?')[0].split('#')[0];
        const name = decodeURIComponent(h.replace(/\/+$/, '').split('/').pop());
        if (AUDIO_RE.test(name)) names.push(name);
      }
      const uniq = Array.from(new Set(names));
      if (uniq.length) return uniq;
    }
  } catch (e) {}

  return (ASSET_FALLBACKS[dir] || []).filter(Boolean);
}

/* ============================================================
   MAIN MENU MUSIC + VISUALIZER
   ============================================================ */
let titleAudio = null, titleAnalyser = null, titleFilter = null, titleGain = null;
const eqBars = [];
const TITLE_VOL = 0.42;
let titleWanted = true;
let titleHoverMute = false;

function buildEq() {
  const eq = $('#eq');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 58; i++) {
    const b = document.createElement('i');
    frag.appendChild(b);
    eqBars.push(b);
  }
  eq.appendChild(frag);
}

async function initTitleMusic() {
  let url = null;
  const files = await listDir('mainassets/');
  if (files.length) {
    url = assetUrl('mainassets/', files[0]);
  } else {
    const candidates = ['theme.mp3','title.mp3','menu.mp3','main.mp3','music.mp3','bgm.mp3','bg.mp3','soundtrack.mp3'];
    for (const c of candidates) {
      if (await probe(assetUrl('mainassets/', c))) { url = assetUrl('mainassets/', c); break; }
    }
  }
  if (!url) return;

  titleAudio = new Audio(url);
  titleAudio.loop = true;
  titleAudio.volume = 0;
  titleAudio.crossOrigin = 'anonymous';

  try {
    const ctx = actx();
    const src = ctx.createMediaElementSource(titleAudio);
    titleAnalyser = ctx.createAnalyser();
    titleAnalyser.fftSize = 256;
    titleAnalyser.smoothingTimeConstant = 0.78;
    titleFilter = ctx.createBiquadFilter();
    titleFilter.type = 'lowpass';
    titleFilter.frequency.value = 18000;
    titleFilter.Q.value = 0.55;
    titleGain = ctx.createGain();
    titleGain.gain.value = 1;
    src.connect(titleFilter);
    titleFilter.connect(titleAnalyser);
    titleAnalyser.connect(titleGain);
    titleGain.connect(ctx.destination);
  } catch (e) {
    titleAnalyser = null;
  }

  tryPlayTitle();
}

function setTitleSoundState(mode) {
  if (!titleAudio) return;
  const target = mode === 'title' ? TITLE_VOL : (mode === 'away' ? 0.095 : 0);
  fadeAudio(titleAudio, target, mode === 'hover' ? 180 : 700);
  if (titleFilter) {
    const targetHz = mode === 'title' ? 18000 : (mode === 'hover' ? 700 : 1900);
    try { titleFilter.frequency.cancelScheduledValues(AC.currentTime); titleFilter.frequency.linearRampToValueAtTime(targetHz, AC.currentTime + (mode === 'hover' ? .12 : .65)); } catch(e) {}
  }
}

function tryPlayTitle() {
  if (!titleAudio) return;
  if (titleAudio.paused) titleAudio.play().catch(() => {});
  setTitleSoundState(titleHoverMute ? 'hover' : (titleWanted ? 'title' : 'away'));
}

const freqData = new Uint8Array(128);
function eqLoop() {
  requestAnimationFrame(eqLoop);
  if (!eqBars.length) return;

  if (titleAnalyser && titleAudio && !titleAudio.paused) {
    titleAnalyser.getByteFrequencyData(freqData);
    const n = eqBars.length;
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.pow(i / n, 1.45) * (freqData.length * 0.72)) + 1;
      const v = (freqData[idx] || 0) / 255;
      eqBars[i].style.height = (2 + v * v * 86).toFixed(1) + 'px';
    }
  } else {
    const t = performance.now() / 1000;
    for (let i = 0; i < eqBars.length; i++) {
      const v = 0.5 + 0.5 * Math.sin(t * 1.7 + i * 0.34);
      eqBars[i].style.height = (2 + v * 14).toFixed(1) + 'px';
    }
  }
}

/* ============================================================
   BUILT-IN TRACK
   ============================================================ */
function bufferToWavUrl(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length;
  const sr = buffer.sampleRate;
  const bytes = 44 + len * numCh * 2;
  const ab = new ArrayBuffer(bytes);
  const view = new DataView(ab);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); view.setUint32(4, bytes - 8, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true); view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  wstr(36, 'data'); view.setUint32(40, len * numCh * 2, true);

  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = clamp(chans[c][i], -1, 1);
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      off += 2;
    }
  }
  return URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
}

async function buildBuiltinSong() {
  const sr = 44100;
  const bpm = 128;
  const beat = 60 / bpm;
  const bars = 28;
  const dur = bars * 4 * beat + 2.4;

  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(2, Math.ceil(sr * dur), sr);

  const bus = ctx.createGain(); bus.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.004;
  bus.connect(comp); comp.connect(ctx.destination);

  const nb = ctx.createBuffer(1, Math.floor(sr * 1.5), sr);
  { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  const kick = (t, g = 1) => {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(170, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.004);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + 0.5);
  };
  const snare = (t, g = 0.4) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    s.connect(hp); hp.connect(gn); gn.connect(bus);
    s.start(t); s.stop(t + 0.2);
  };
  const hat = (t, g = 0.14, dec = 0.045) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7600;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    s.connect(hp); hp.connect(gn); gn.connect(bus);
    s.start(t); s.stop(t + dec + 0.03);
  };
  const bassNote = (t, f, d, g = 0.42) => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 9;
    lp.frequency.setValueAtTime(520, t);
    lp.frequency.exponentialRampToValueAtTime(130, t + d);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.012);
    gn.gain.setValueAtTime(g, t + d - 0.06);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(lp); lp.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + d + 0.06);
  };
  const stab = (t, f, d, g = 0.07) => {
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.Q.value = 5;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(lp); lp.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t + d + 0.03);
  };

  const roots = [55.00, 55.00, 65.41, 49.00];
  const scale = [0, 3, 7, 10, 12];

  for (let bar = 0; bar < bars; bar++) {
    const bt = bar * 4 * beat;
    const root = roots[bar % 4];
    const section = bar < 4 ? 0 : bar < 10 ? 1 : bar < 22 ? 2 : 3;

    const hatDiv = section >= 2 ? 4 : 2;
    for (let i = 0; i < 4 * hatDiv; i++) {
      const t = bt + i * (beat / hatDiv);
      hat(t, i % hatDiv === 0 ? 0.10 : 0.055, 0.035);
    }
    if (section >= 1) for (let i = 0; i < 4; i++) kick(bt + i * beat, 1);
    else if (bar >= 2) for (let i = 0; i < 4; i++) kick(bt + i * beat, 0.8);

    if (section >= 2) { snare(bt + beat, 0.32); snare(bt + 3 * beat, 0.32); }

    if (section >= 1) {
      for (let i = 0; i < 4; i++) bassNote(bt + i * beat, root, beat * 0.92, 0.4);
      if (section >= 2) for (let i = 0; i < 4; i++) bassNote(bt + i * beat + beat * 0.5, root, beat * 0.4, 0.22);
    } else {
      for (let i = 0; i < 2; i++) bassNote(bt + i * 2 * beat, root, beat * 1.6, 0.3);
    }

    if (section >= 2 && (bar % 2 === 0)) {
      for (let i = 0; i < 4; i++) {
        if ((bar + i) % 3 === 0) continue;
        stab(bt + (1.5 + i) * beat, root * 4 * Math.pow(2, scale[(bar + i) % scale.length] / 12), 0.22, 0.06);
      }
    }
  }

  const rendered = await ctx.startRendering();
  const url = bufferToWavUrl(rendered);
  return {
    id: 'builtin',
    title: 'Null Signal (Built-in)',
    url,
    buffer: rendered,
    status: 'pending',
    builtin: true
  };
}

/* ============================================================
   BEAT ANALYSIS / CHART GENERATION
   ============================================================
   The key to "perfectly timed" feel:
     1. Onset detection via spectral flux
     2. Tempo estimation via autocorrelation
     3. Beat phase estimation (find offset that maximizes alignment)
     4. Snap onsets to a beat grid (so notes land exactly on beats)
     5. Choose subdivision based on how dense the music is
   ============================================================ */
function mixToMono(buffer) {
  const n = buffer.length;
  const chs = [];
  for (let c = 0; c < buffer.numberOfChannels; c++) chs.push(buffer.getChannelData(c));
  const out = new Float32Array(n);
  if (chs.length === 1) { out.set(chs[0]); return out; }
  const inv = 1 / chs.length;
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let c = 0; c < chs.length; c++) s += chs[c][i];
    out[i] = s * inv;
  }
  return out;
}

function downsample(data, sr, target) {
  if (sr <= target) return data;
  const ratio = sr / target;
  const outLen = Math.floor(data.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(data.length, Math.floor((i + 1) * ratio));
    let s = 0;
    for (let j = start; j < end; j++) s += data[j];
    out[i] = s / Math.max(1, end - start);
  }
  return out;
}

function fftInPlace(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    const half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cwr = 1, cwi = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = i + k + half;
        const ur = re[a], ui = im[a];
        const vr = re[b] * cwr - im[b] * cwi;
        const vi = re[b] * cwi + im[b] * cwr;
        re[a] = ur + vr; im[a] = ui + vi;
        re[b] = ur - vr; im[b] = ui - vi;
        const nwr = cwr * wr - cwi * wi;
        cwi = cwr * wi + cwi * wr;
        cwr = nwr;
      }
    }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Estimate BPM via autocorrelation of onset envelope */
function estimateTempo(flux, hopTime) {
  const minBPM = 60, maxBPM = 190;
  const minLag = Math.max(1, Math.round(60 / maxBPM / hopTime));
  const maxLag = Math.min(flux.length - 1, Math.round(60 / minBPM / hopTime));
  let bestLag = minLag, bestScore = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let score = 0;
    const n = flux.length - lag;
    for (let i = 0; i < n; i++) score += flux[i] * flux[i + lag];
    score /= Math.max(1, n);
    // slight bias toward 90-150 BPM range for pop/electronic music
    const bpmAtLag = 60 / (lag * hopTime);
    if (bpmAtLag >= 85 && bpmAtLag <= 165) score *= 1.15;
    if (score > bestScore) { bestScore = score; bestLag = lag; }
  }
  return 60 / (bestLag * hopTime);
}

/* Find the beat phase (offset) that best aligns onsets to a beat grid */
function estimatePhase(onsets, beatDur) {
  const steps = 64;
  let bestPhase = 0, bestScore = -1;
  for (let s = 0; s < steps; s++) {
    const phase = (s / steps) * beatDur;
    let score = 0;
    for (const o of onsets) {
      const rel = (o.t - phase) / beatDur;
      const rounded = Math.round(rel);
      const err = Math.abs(rel - rounded);
      if (err < 0.15) score += o.v * (1 - err / 0.15);
    }
    if (score > bestScore) { bestScore = score; bestPhase = phase; }
  }
  return bestPhase;
}

/* Decide the beat subdivision (1=quarter, 2=eighth, 4=sixteenth) */
function chooseSubdivision(onsets, beatDur, phase) {
  const grids = [1, 2, 4];
  let bestSub = 2, bestScore = -1;
  for (const sub of grids) {
    const step = beatDur / sub;
    let score = 0, matched = 0;
    for (const o of onsets) {
      const rel = (o.t - phase) / step;
      const err = Math.abs(rel - Math.round(rel));
      if (err < 0.3) {
        score += o.v * (1 - err / 0.3);
        matched++;
      }
    }
    // Penalize when we ignore many onsets
    const cover = matched / Math.max(1, onsets.length);
    const finalScore = score * (0.55 + 0.45 * cover);
    if (finalScore > bestScore) { bestScore = finalScore; bestSub = sub; }
  }
  return bestSub;
}

const GOLDEN = 0.6180339887;

function buildChart(buffer) {
  const N = 1024, H = 512, TARGET = 11025;
  const mono = downsample(mixToMono(buffer), buffer.sampleRate, TARGET);
  const frames = Math.max(1, Math.floor((mono.length - N) / H));
  const hop = H / TARGET;

  const hann = new Float32Array(N);
  for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));

  const re = new Float32Array(N), im = new Float32Array(N);
  const mag = new Float32Array(N / 2), prev = new Float32Array(N / 2);

  const flux = new Float32Array(frames);
  const lowE = new Float32Array(frames), midE = new Float32Array(frames), hiE = new Float32Array(frames);

  const NB = N / 2, invN = 1 / (N / 2);

  for (let f = 0; f < frames; f++) {
    const off = f * H;
    for (let i = 0; i < N; i++) { re[i] = mono[off + i] * hann[i]; im[i] = 0; }
    fftInPlace(re, im);

    let fl = 0, lo = 0, mi = 0, hi = 0;
    for (let k = 0; k < NB; k++) {
      const m = Math.sqrt(re[k] * re[k] + im[k] * im[k]) * invN;
      mag[k] = m;
      const d = m - prev[k];
      if (d > 0) fl += d;
      prev[k] = m;
      if (k >= 1 && k < 12) lo += m;
      else if (k >= 12 && k < 60) mi += m;
      else if (k >= 60 && k < 250) hi += m;
    }
    flux[f] = fl; lowE[f] = lo; midE[f] = mi; hiE[f] = hi;
  }

  let maxF = 0;
  for (let f = 0; f < frames; f++) if (flux[f] > maxF) maxF = flux[f];
  if (maxF > 0) for (let f = 0; f < frames; f++) flux[f] /= maxF;

  // Onset detection via adaptive peak picking on spectral flux
  const W = 16;
  const onsets = [];
  let lastT = -10;
  const MIN_GAP = 0.10;

  for (let f = 2; f < frames - 2; f++) {
    const v = flux[f];
    if (v < flux[f - 1] || v < flux[f + 1]) continue;
    let sum = 0, cnt = 0;
    const a = Math.max(0, f - W), b = Math.min(frames, f + W + 1);
    for (let j = a; j < b; j++) { sum += flux[j]; cnt++; }
    const th = (sum / cnt) * 1.7 + 0.005;
    if (v < th) continue;
    const t = f * hop;
    if (t - lastT < MIN_GAP) continue;
    lastT = t;
    onsets.push({ t, f, v, low: lowE[f], mid: midE[f], hi: hiE[f] });
  }

  // --- Tempo + phase + subdivision ---
  const bpm = estimateTempo(flux, hop);
  const beatDur = 60 / bpm;
  const phase = estimatePhase(onsets, beatDur);
  const subdiv = chooseSubdivision(onsets, beatDur, phase);
  const gridStep = beatDur / subdiv;

  // --- Snap onsets to grid ---
  const snapped = [];
  for (const o of onsets) {
    const idx = Math.round((o.t - phase) / gridStep);
    const snappedT = phase + idx * gridStep;
    const err = Math.abs(o.t - snappedT);
    // Only keep onsets that snap reasonably well
    if (err > gridStep * 0.35) continue;
    snapped.push({ idx, t: snappedT, v: o.v, low: o.low, mid: o.mid, hi: o.hi, origT: o.t });
  }

  // Deduplicate: one note per grid index, keep strongest
  const byIdx = new Map();
  for (const s of snapped) {
    if (!byIdx.has(s.idx) || byIdx.get(s.idx).v < s.v) byIdx.set(s.idx, s);
  }
  const gridded = Array.from(byIdx.values()).sort((a, b) => a.t - b.t);

  // --- Note assignment: lane, type, direction ---
  const rnd = mulberry32(0xC0FFEE ^ gridded.length);
  const notes = [];
  let prevLane = 1;
  let lanesSinceJump = 0;
  let lastSwipeIdx = -8;

  for (let i = 0; i < gridded.length; i++) {
    const o = gridded[i];
    const tot = o.low + o.mid + o.hi + 1e-9;
    const lowR = o.low / tot, midR = o.mid / tot, hiR = o.hi / tot;

    // ---- Lane selection ----
    // Bass -> left, mid -> center, treble -> right, with variety bias
    let lane;
    if (lowR > midR && lowR > hiR) lane = 0;
    else if (hiR > midR) lane = 2;
    else lane = 1;

    // Break ties / add variety: if same lane 3+ in a row, jump
    if (lane === prevLane) lanesSinceJump++;
    else lanesSinceJump = 0;
    if (lanesSinceJump >= 2 && rnd() < 0.75) {
      const opts = [0, 1, 2].filter(l => l !== prevLane);
      lane = opts[Math.floor(rnd() * opts.length)];
      lanesSinceJump = 0;
    }
    // Occasionally force middle on strong downbeats
    if (o.idx % (subdiv * 4) === 0 && rnd() < 0.4) lane = 1;

    // ---- Type assignment ----
    // Mostly taps; swipes appear on strong beats with spacing
    let type = 'tap';
    let dir = 0;
    const isStrongBeat = (o.idx % subdiv === 0);
    const isDownbeat = (o.idx % (subdiv * 4) === 0);
    const energy = o.v;

    const canSwipe = i - lastSwipeIdx >= Math.max(3, subdiv * 2);
    const nearEnd = i < gridded.length - 2;
    const nextNote = nearEnd ? gridded[i + 1] : null;
    const gapAfter = nextNote ? (nextNote.t - o.t) : 1;

    // Choose swipe if: strong beat, high energy, or periodic rhythm
    let swipeChance = 0;
    if (isDownbeat) swipeChance += 0.35;
    else if (isStrongBeat) swipeChance += 0.15;
    if (energy > 0.7) swipeChance += 0.25;
    if (o.idx % 16 === 0) swipeChance += 0.4; // every 4 bars in 4/4
    if (swipeChance > 0 && canSwipe && gapAfter > gridStep * 1.2 && rnd() < swipeChance) {
      type = 'swipe';
      // Direction: alternate based on position in phrase
      dir = ((o.idx / subdiv) & 1) === 0 ? -1 : 1; // -1 = left, 1 = right
      // Add randomness to feel natural
      if (rnd() < 0.3) dir *= -1;
      lastSwipeIdx = i;
    }

    notes.push({
      t: o.t,
      lane,
      type,      // 'tap' or 'swipe'
      dir,       // -1 left, 0 none, 1 right
      energy: clamp(energy * 1.6, 0, 1),
      hit: false,
      missed: false,
      resolved: false
    });

    prevLane = lane;
  }

  const duration = buffer.duration;
  const density = duration > 0 ? notes.length / duration : 0;
  let difficulty;
  if (density < 1.5) difficulty = 'EASY';
  else if (density < 2.5) difficulty = 'NORMAL';
  else if (density < 3.8) difficulty = 'HARD';
  else difficulty = 'EXTREME';

  return { notes, duration, density, difficulty, bpm };
}

const DIFF_CFG = {
  EASY:    { approach: 1.75, missWindow: 0.21 },
  NORMAL:  { approach: 1.55, missWindow: 0.18 },
  HARD:    { approach: 1.35, missWindow: 0.16 },
  EXTREME: { approach: 1.15, missWindow: 0.14 }
};

/* ============================================================
   SONG LIBRARY
   ============================================================ */
const songs = [];
let analyzing = false;

function prettyName(fn) {
  return fn.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function fallbackChart(duration, seed = 1337) {
  const safeDuration = Math.max(4, Number(duration) || 4);
  const bpm = 120;
  const beat = 60 / bpm;
  const rnd = mulberry32(seed >>> 0);
  const notes = [];
  let lastLane = 1;
  let lastSwipe = -8;
  let i = 0;
  for (let t = 1.2; t < safeDuration - 0.55; t += beat / 2) {
    if (rnd() < 0.15) { i++; continue; }
    let lane = Math.floor(rnd() * 3);
    if (lane === lastLane && rnd() < 0.5) lane = (lane + 1 + Math.floor(rnd() * 2)) % 3;
    let type = 'tap', dir = 0;
    if (i - lastSwipe > 6 && rnd() < 0.2) {
      type = 'swipe';
      dir = rnd() < 0.5 ? -1 : 1;
      lastSwipe = i;
    }
    notes.push({ t, lane, type, dir, energy: .5 + rnd() * .4, hit: false, missed: false, resolved: false });
    lastLane = lane;
    i++;
  }
  const density = notes.length / safeDuration;
  const difficulty = density < 1.5 ? 'EASY' : density < 2.5 ? 'NORMAL' : density < 3.8 ? 'HARD' : 'EXTREME';
  return { notes, duration: safeDuration, density, difficulty, bpm };
}

function getAudioDuration(url) {
  return new Promise(resolve => {
    const a = new Audio();
    let done = false;
    const finish = value => { if (done) return; done = true; a.removeAttribute('src'); a.load(); resolve(Number.isFinite(value) ? value : 0); };
    a.preload = 'metadata';
    a.addEventListener('loadedmetadata', () => finish(a.duration), { once: true });
    a.addEventListener('error', () => finish(0), { once: true });
    a.src = url;
  });
}

function ensureAnalysis(song) {
  if (song.promise) return song.promise;
  song.promise = (async () => {
    song.status = 'analyzing';
    updateCard(song);
    try {
      let buf = song.buffer || null;
      if (!buf) {
        const res = await fetch(song.url);
        if (!res.ok) throw new Error('fetch failed');
        const ab = await res.arrayBuffer();
        buf = await actx().decodeAudioData(ab);
      }
      const chart = buildChart(buf);
      song.chart = chart;
      song.duration = chart.duration;
      song.difficulty = chart.difficulty;
      song.noteCount = chart.notes.length;
      song.density = chart.density;
      song.bpm = chart.bpm;
      song.status = 'ready';
    } catch (e) {
      console.warn('waveform analysis unavailable for', song.title, e);
      const duration = await getAudioDuration(song.url);
      if (duration > 0) {
        song.chart = fallbackChart(duration, song.id.length * 997 + song.title.length * 31);
        song.duration = song.chart.duration;
        song.difficulty = song.chart.difficulty;
        song.noteCount = song.chart.notes.length;
        song.density = song.chart.density;
        song.bpm = song.chart.bpm;
        song.status = 'ready';
      } else {
        song.status = 'error';
      }
    }
    song.buffer = null;
    updateCard(song);
    return song;
  })();
  return song.promise;
}

async function analyzeQueue() {
  if (analyzing) return;
  analyzing = true;
  for (const s of songs) {
    if (s.status === 'pending') {
      await ensureAnalysis(s);
      await new Promise(r => setTimeout(r, 50));
    }
  }
  analyzing = false;
}

function updateCard(s) {
  if (!s.el) return;
  const meta = s.el.querySelector('[data-meta]');
  const diff = s.el.querySelector('[data-diff]');
  if (s.status === 'ready') {
    meta.textContent = `${fmtTime(s.duration)} · ${s.noteCount} NOTES · ${Math.round(s.bpm || 0)} BPM`;
    diff.textContent = s.difficulty;
    diff.className = 'card-diff d-' + s.difficulty.toLowerCase();
  } else if (s.status === 'analyzing') {
    meta.textContent = 'ANALYZING WAVEFORM…';
    diff.textContent = '—';
    diff.className = 'card-diff';
  } else if (s.status === 'error') {
    meta.textContent = 'UNAVAILABLE';
    diff.textContent = '—';
    diff.className = 'card-diff';
  } else {
    meta.textContent = 'QUEUED';
    diff.textContent = '—';
    diff.className = 'card-diff';
  }
}

/* ---------- preview ---------- */
let previewAudio = null, previewCard = null;

function playPreview(song, el) {
  if (previewCard === el) return;
  stopPreview();
  previewCard = el;
  el.classList.add('previewing');

  titleHoverMute = true;
  if (titleAudio) setTitleSoundState('hover');

  try {
    previewAudio = new Audio(song.url);
    previewAudio.volume = 0;
    previewAudio.addEventListener('loadedmetadata', () => {
      try {
        const d = previewAudio.duration;
        if (isFinite(d) && d > 8) previewAudio.currentTime = Math.min(d * 0.22, 32);
      } catch (e) {}
    });
    previewAudio.play()
      .then(() => fadeAudio(previewAudio, 0.5, 450))
      .catch(() => {});
  } catch (e) {}
}

function stopPreview() {
  if (previewAudio) {
    try { previewAudio.pause(); } catch (e) {}
    previewAudio.src = '';
    previewAudio = null;
  }
  if (previewCard) { previewCard.classList.remove('previewing'); previewCard = null; }
  titleHoverMute = false;
  if (titleAudio && !titleAudio.paused) setTitleSoundState(titleWanted ? 'title' : 'away');
}

/* ---------- rendering the list ---------- */
let touchPreviewId = null;
let suppressClick = false;

function renderSongs() {
  const list = $('#songList');
  list.innerHTML = '';

  if (!songs.length) {
    const d = document.createElement('div');
    d.className = 'empty-note';
    d.textContent = 'No tracks found. Add audio files to /music or update music/manifest.json.';
    list.appendChild(d);
    return;
  }

  songs.forEach(s => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="track-no">' + String(songs.indexOf(s) + 1).padStart(2, '0') + '</div>' +
      '<div class="vinyl"></div>' +
      '<div class="card-info">' +
        '<div class="card-title">' + esc(s.title) + '</div>' +
        '<div class="card-meta" data-meta>QUEUED</div>' +
      '</div>' +
      '<div class="card-diff" data-diff>—</div>';

    el.addEventListener('pointerenter', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      playPreview(s, el);
    });
    el.addEventListener('pointerleave', e => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopPreview();
    });
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      if (touchPreviewId !== s.id) {
        touchPreviewId = s.id;
        playPreview(s, el);
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 450);
      }
    });
    el.addEventListener('click', () => {
      if (suppressClick) return;
      startGame(s);
    });

    list.appendChild(el);
    s.el = el;
    updateCard(s);
  });
}

/* ============================================================
   SCREEN ROUTING
   ============================================================ */
function showScreen(id) {
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  titleWanted = (id === 'menu');
  titleHoverMute = false;
  $('#menu').classList.toggle('soft-focus', id !== 'menu');
  if (titleAudio) {
    setTitleSoundState(id === 'menu' ? 'title' : (id === 'songs' ? 'away' : 'game'));
    if (id === 'game') { try { titleAudio.pause(); } catch(e) {} }
    else if (titleAudio.paused) titleAudio.play().catch(() => {});
  }
  if (id === 'menu') setTimeout(resizeCanvas, 30);
}

/* ============================================================
   GAME
   ============================================================
   Three lanes at the bottom of the screen. Notes fall from the
   top toward a horizontal hit line. Each note lands in one lane.

     - TAP notes  (circle)  → tap that lane
     - SWIPE notes (arrow)  → swipe from that lane in the arrow's
                              direction (left or right)

   Timing is measured from the moment the pointer first touches
   the pad, using the AudioContext clock for sub-ms precision.
   ============================================================ */
const cv = $('#cv');
const ctx = cv.getContext('2d', { alpha: false });

// Audio offset: positive value compensates for browser audio pipeline delay.
// Tuned by feel on iOS; can be adjusted per-user in the future.
const AUDIO_OFFSET = 0.020;

// Scoring windows (seconds)
const PERFECT = 0.050;
const GREAT   = 0.095;
const GOOD    = 0.145;

// Swipe gesture detection
const SWIPE_MIN_DIST = 40;      // px
const SWIPE_MAX_TIME = 320;     // ms

const game = {
  running: false,
  song: null,
  audio: null,
  notes: [],
  approach: 1.55,
  missWindow: 0.18,
  score: 0,
  combo: 0,
  maxCombo: 0,
  health: 100,
  perfect: 0,
  great: 0,
  good: 0,
  miss: 0,
  // rendering state
  particles: [],
  popups: [],
  laneFlash: [0, 0, 0, 0],
  padFlash: [0, 0, 0],        // for the 3 pads
  failed: false,
  finished: false,
  raf: 0,
  audioCtx: null,
  analyser: null,
  freq: null,
  bass: 0, mid: 0, hi: 0,
  // timing
  startCtxTime: 0,
  startAudioTime: 0,
  introEnd: 0,
  // layout
  W: 0, H: 0,
  padTop: 0, hitY: 0,
  laneX: [0, 0, 0],
  laneW: 0,
  // pointer tracking for swipe detection
  pointers: new Map(), // pointerId -> { startX, startY, startTime, lane, note, confirmed }
  // shake
  shakeMag: 0
};

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  game.W = w;
  game.H = h;
  // Pads occupy the bottom ~22% (with minimum height)
  const padH = Math.max(140, Math.min(220, h * 0.24));
  game.padTop = h - padH;
  game.hitY = game.padTop; // notes cross the top edge of the pads
  game.laneW = w / 3;
  game.laneX = [w / 6, w / 2, w * 5 / 6];
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 240));

function gameTime() {
  if (!game.audioCtx) return 0;
  return (game.audioCtx.currentTime - game.startCtxTime) + game.startAudioTime - AUDIO_OFFSET;
}

/* ---------- geometry ---------- */
function noteY(note, t) {
  const dt = note.t - t;             // time until the note should be hit
  const p = 1 - dt / game.approach;  // 0 = spawn, 1 = at hit line
  // Spawn above the top of the screen, move to hit line
  const spawnY = -60;
  return spawnY + (game.hitY - spawnY) * p;
}

/* ---------- visual feedback ---------- */
function spawnParticles(x, y, color, energy) {
  const n = Math.round(10 + energy * 14);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 100 + Math.random() * 320 * (0.4 + energy);
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      r: 2 + Math.random() * 4,
      life: 0.55 + Math.random() * 0.4,
      color
    });
  }
}

function pushPopup(x, y, text, color, life = 0.9) {
  game.popups.push({ x, y, text, color, life });
}

function shake(mag) {
  game.shakeMag = Math.max(game.shakeMag, mag);
}

/* ---------- scoring ---------- */
function resolveHit(note, tapTime) {
  const dt = Math.abs(note.t - tapTime);
  let label, gain, color;
  if (dt <= PERFECT)      { label = 'PERFECT'; gain = 320; game.perfect++; game.health = clamp(game.health + 2.0, 0, 100); color = '#ffffff'; }
  else if (dt <= GREAT)   { label = 'GREAT';   gain = 220; game.great++;   game.health = clamp(game.health + 1.4, 0, 100); color = '#ffd0d7'; }
  else if (dt <= GOOD)    { label = 'GOOD';    gain = 120; game.good++;    game.health = clamp(game.health + 0.7, 0, 100); color = '#ff7a90'; }
  else                    { label = 'GOOD';    gain = 60;  game.good++;    game.health = clamp(game.health + 0.3, 0, 100); color = '#ff7a90'; }

  note.hit = true;
  note.resolved = true;

  game.combo++;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;

  const mult = 1 + Math.min(game.combo, 150) / 150 * 0.7;
  game.score += Math.round(gain * mult);

  const x = game.laneX[note.lane];
  const y = game.hitY;
  spawnParticles(x, y, color, note.energy);
  pushPopup(x, y - 30, label, color);

  game.padFlash[note.lane] = 1;
  if (dt <= PERFECT) shake(6);
  else if (dt <= GREAT) shake(3);

  updateHud();
}

function onMiss(note) {
  game.miss++;
  game.combo = 0;
  game.health = clamp(game.health - 8.0, 0, 100);
  const x = game.laneX[note.lane];
  pushPopup(x, game.hitY - 30, 'MISS', '#8c0f22', 0.7);
  updateHud();
  if (game.health <= 0 && !game.failed) {
    game.failed = true;
    finishGame();
  }
}

/* ---------- input handling ----------
   Pointer down on a pad:
     - Tap note in window: resolve immediately using pointerdown time
     - Swipe note in window: start tracking for direction confirmation
     - Nothing: small penalty

   Pointer move while tracking:
     - If distance & direction match, confirm the swipe hit
     - Timing is from pointerdown (not pointermove)

   Pointer up:
     - If a swipe was tracking and never confirmed, count as miss
*/
function laneFromX(x) {
  return clamp(Math.floor(x / game.laneW), 0, 2);
}

function findCandidateNote(lane, tapTime) {
  let best = null, bestDt = Infinity;
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed || n.resolved) continue;
    if (n.lane !== lane) continue;
    const dt = Math.abs(n.t - tapTime);
    if (dt > game.missWindow) continue;
    if (dt < bestDt) { bestDt = dt; best = n; }
    if (n.t - tapTime > game.missWindow + 0.1) break;
  }
  return best;
}

function onPointerDown(e) {
  if (!game.running || game.finished) return;
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const t = gameTime();
  if (t < game.introEnd) return;

  // Only trigger pads if pointer is inside the pad zone
  if (y < game.padTop - 20) {
    // Above pads -> ignore (prevents accidental taps)
    return;
  }

  const lane = laneFromX(x);
  game.padFlash[lane] = Math.max(game.padFlash[lane], 0.7);

  const note = findCandidateNote(lane, t);
  if (!note) {
    // Empty tap -> tiny penalty, but generous
    game.health = clamp(game.health - 0.35, 0, 100);
    updateHud();
    return;
  }

  if (note.type === 'tap') {
    resolveHit(note, t);
  } else if (note.type === 'swipe') {
    // Start tracking pointer for direction
    note.resolved = true; // mark so nothing else grabs it
    game.pointers.set(e.pointerId, {
      startX: x, startY: y, startTime: performance.now(),
      lane, note, tapTime: t, confirmed: false
    });
  }
}

function onPointerMove(e) {
  const p = game.pointers.get(e.pointerId);
  if (!p || p.confirmed) return;
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const dx = x - p.startX;
  const dy = y - p.startY;
  const elapsed = performance.now() - p.startTime;
  if (elapsed > SWIPE_MAX_TIME) return;

  const dist = Math.hypot(dx, dy);
  if (dist < SWIPE_MIN_DIST) return;

  // Determine intended direction
  const horizontal = Math.abs(dx) >= Math.abs(dy);
  if (!horizontal) return; // vertical swipes aren't a valid gesture

  const dir = dx > 0 ? 1 : -1;
  if (dir !== p.note.dir) return;

  // Confirmed!
  p.confirmed = true;
  // Tap timing is from initial contact
  resolveHit(p.note, p.tapTime);
  game.pointers.delete(e.pointerId);
}

function onPointerUp(e) {
  const p = game.pointers.get(e.pointerId);
  if (!p) return;
  game.pointers.delete(e.pointerId);
  if (!p.confirmed) {
    // Failed to swipe in time -> count as miss
    if (!p.note.hit && !p.note.missed) {
      p.note.missed = true;
      onMiss(p.note);
    }
  }
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  onPointerDown(e);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (game.pointers.size === 0) return;
  onPointerMove(e);
}, { passive: true });
cv.addEventListener('pointerup', onPointerUp);
cv.addEventListener('pointercancel', onPointerUp);

/* Keyboard fallback — A/S/D or ←/↓/→ for taps, Q/E for swipes */
const KEY_LANE = { a: 0, s: 1, d: 2, arrowleft: 0, arrowdown: 1, arrowright: 2 };
const KEY_SWIPE = { q: -1, e: 1 };

window.addEventListener('keydown', e => {
  if (!game.running || game.finished) return;
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  const t = gameTime();
  if (t < game.introEnd) return;

  if (k in KEY_LANE) {
    const lane = KEY_LANE[k];
    const note = findCandidateNote(lane, t);
    if (note && note.type === 'tap') {
      resolveHit(note, t);
    } else if (note && note.type === 'swipe' && note.dir === 0) {
      resolveHit(note, t);
    } else if (!note) {
      game.health = clamp(game.health - 0.35, 0, 100);
    }
  } else if (k in KEY_SWIPE) {
    const dir = KEY_SWIPE[k];
    // Find any swipe note in window in any lane matching direction
    for (let i = 0; i < game.notes.length; i++) {
      const n = game.notes[i];
      if (n.hit || n.missed || n.resolved) continue;
      if (n.type !== 'swipe' || n.dir !== dir) continue;
      if (Math.abs(n.t - t) <= game.missWindow) {
        resolveHit(n, t);
        break;
      }
      if (n.t - t > game.missWindow + 0.1) break;
    }
  }
});

/* ---------- HUD ---------- */
function updateHud() {
  $('#ghScore').textContent = game.score.toLocaleString();
  $('#healthFill').style.width = game.health.toFixed(1) + '%';
  $('#healthWrap').classList.toggle('low', game.health < 35);

  const comboEl = $('#ghCombo');
  if (game.combo >= 3) {
    comboEl.firstChild.nodeValue = String(game.combo);
    $('#ghComboLabel').textContent = game.combo >= 30 ? 'BLAZING' : 'CHAIN';
    comboEl.classList.add('show');
  } else {
    comboEl.classList.remove('show');
  }
}

/* ---------- main loop ---------- */
function gameLoop() {
  if (!game.running) return;
  const t = gameTime();

  // Miss detection
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed || n.resolved) {
      // If a swipe note was marked resolved but never confirmed, keep waiting
      // until the pointer handler decides. If it's still unresolved and the
      // window has elapsed, treat as miss.
      if (n.resolved && !n.hit && !n.missed && t > n.t + game.missWindow + 0.05) {
        // Only count as miss if no active pointer is tracking it
        let tracked = false;
        for (const p of game.pointers.values()) if (p.note === n) { tracked = true; break; }
        if (!tracked) { n.missed = true; onMiss(n); }
      }
      continue;
    }
    if (n.t - t > game.approach + 0.5) break;
    if (t > n.t + game.missWindow) {
      n.missed = true;
      onMiss(n);
    }
  }

  drawGame(t);
  game.raf = requestAnimationFrame(gameLoop);
}

/* ---------- rendering ---------- */
function drawGame(t) {
  const W = game.W, H = game.H;

  // Audio analysis
  if (game.analyser && game.freq) {
    game.analyser.getByteFrequencyData(game.freq);
    let lo = 0, mi = 0, hi = 0, lc = 0, mc = 0, hc = 0;
    for (let i = 0; i < game.freq.length; i++) {
      const v = game.freq[i] / 255;
      if (i < 8) { lo += v; lc++; }
      else if (i < 40) { mi += v; mc++; }
      else { hi += v; hc++; }
    }
    game.bass = lo / Math.max(1, lc);
    game.mid = mi / Math.max(1, mc);
    game.hi = hi / Math.max(1, hc);
  } else {
    const s = performance.now() / 1000;
    game.bass = 0.5 + 0.35 * Math.sin(s * Math.PI * 2 / 0.45);
    game.mid = 0.4;
    game.hi = 0.3;
  }

  const pulse = clamp(game.bass * 1.6, 0, 1);

  // Screen shake
  if (game.shakeMag > 0.1) {
    ctx.save();
    const ang = Math.random() * Math.PI * 2;
    const dx = Math.cos(ang) * game.shakeMag;
    const dy = Math.sin(ang) * game.shakeMag;
    ctx.translate(dx, dy);
    game.shakeMag *= 0.82;
  } else {
    ctx.save();
    game.shakeMag = 0;
  }

  // ---- Background ----
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#07060a');
  bg.addColorStop(0.55, '#050408');
  bg.addColorStop(1, '#0a0508');
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Bass-reactive horizon glow
  const horizon = ctx.createRadialGradient(W / 2, game.padTop, 0, W / 2, game.padTop, W * 0.75);
  horizon.addColorStop(0, `rgba(255,31,61,${0.08 + pulse * 0.14})`);
  horizon.addColorStop(1, 'rgba(255,31,61,0)');
  ctx.fillStyle = horizon;
  ctx.fillRect(0, game.padTop - H * 0.5, W, H * 0.5);

  // Lane dividers
  ctx.save();
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(i * game.laneW, 0);
    ctx.lineTo(i * game.laneW, game.padTop);
    ctx.strokeStyle = `rgba(255,255,255,0.035)`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();

  // Subtle vertical gradient near the pads
  const padGlow = ctx.createLinearGradient(0, game.padTop - 40, 0, game.padTop + 40);
  padGlow.addColorStop(0, 'rgba(255,31,61,0)');
  padGlow.addColorStop(0.5, `rgba(255,31,61,${0.10 + pulse * 0.15})`);
  padGlow.addColorStop(1, 'rgba(255,31,61,0)');
  ctx.fillStyle = padGlow;
  ctx.fillRect(0, game.padTop - 40, W, 80);

  // ---- Hit line ----
  ctx.beginPath();
  ctx.moveTo(0, game.hitY);
  ctx.lineTo(W, game.hitY);
  ctx.strokeStyle = `rgba(255,255,255,${0.35 + pulse * 0.35})`;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, game.hitY + 4);
  ctx.lineTo(W, game.hitY + 4);
  ctx.strokeStyle = `rgba(255,31,61,${0.25 + pulse * 0.35})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // ---- Pads ----
  for (let i = 0; i < 3; i++) {
    const padX = i * game.laneW;
    const flash = game.padFlash[i];

    // pad background
    ctx.fillStyle = `rgba(255,255,255,${0.015 + flash * 0.04})`;
    ctx.fillRect(padX + 2, game.padTop + 2, game.laneW - 4, H - game.padTop - 4);

    // border between lanes in pad area
    if (i > 0) {
      ctx.beginPath();
      ctx.moveTo(padX, game.padTop);
      ctx.lineTo(padX, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // pad glow when flashed
    if (flash > 0.02) {
      const cx = game.laneX[i];
      const cy = game.padTop + (H - game.padTop) / 2;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, game.laneW * 0.9);
      g.addColorStop(0, `rgba(255,31,61,${flash * 0.55})`);
      g.addColorStop(1, 'rgba(255,31,61,0)');
      ctx.fillStyle = g;
      ctx.fillRect(padX, game.padTop, game.laneW, H - game.padTop);
    }

    // key hint
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,255,255,${0.08 + flash * 0.35})`;
    ctx.font = '900 12px -apple-system,Helvetica,Arial,sans-serif';
    ctx.fillText(['A', 'S', 'D'][i], game.laneX[i], H - 22);
    ctx.restore();
  }

  // ---- Notes ----
  for (let i = 0; i < game.notes.length; i++) {
    const n = game.notes[i];
    if (n.hit || n.missed) continue;
    const dt = n.t - t;
    if (dt > game.approach) continue;
    if (dt < -game.missWindow - 0.25) continue;
    drawNote(n, t);
  }

  // ---- Particles ----
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.vy += 800 * 0.016;
    p.vx *= 0.97;
    p.life -= 0.026;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color === '#ffffff' ? '255,255,255' : '255,60,90'},${p.life})`;
    ctx.fill();
  }

  // ---- Popups ----
  ctx.textAlign = 'center';
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.life -= 0.028;
    if (p.life <= 0) { game.popups.splice(i, 1); continue; }
    const y = p.y - (1 - p.life) * 50;
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.font = '900 15px -apple-system,Helvetica,Arial,sans-serif';
    ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;

  // Intro countdown
  const introLeft = game.introEnd - t;
  if (introLeft > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,31,61,.9)';
    ctx.shadowBlur = 30;
    ctx.font = '900 ' + Math.round(Math.min(W, H) * 0.14) + 'px -apple-system,Helvetica,Arial,sans-serif';
    const num = Math.ceil(introLeft);
    ctx.fillText(num > 0 ? String(num) : 'GO', W / 2, H * 0.4);
    ctx.restore();
  }

  // decay pads
  for (let i = 0; i < 3; i++) game.padFlash[i] *= 0.88;

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

function drawNote(n, t) {
  const x = game.laneX[n.lane];
  const y = noteY(n, t);
  const dt = n.t - t;
  const near = clamp(1 - Math.abs(dt) / 0.4, 0.3, 1);

  const accent = n.energy > 0.7;
  const size = 26 + n.energy * 22;

  if (n.type === 'tap') {
    // --- TAP note: glowing circle with ring ---
    const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 2.2);
    glow.addColorStop(0, `rgba(255,255,255,${0.55 * near})`);
    glow.addColorStop(0.35, `rgba(255,31,61,${0.7 * near})`);
    glow.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, size * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Outer ring
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * near})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Inner disc
    const g = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, 0, x, y, size);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, accent ? '#ff8b9d' : '#ff1f3d');
    g.addColorStop(1, '#64091a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.72, 0, Math.PI * 2);
    ctx.fill();

    // Downbeat indicator
    if (accent) {
      ctx.beginPath();
      ctx.arc(x, y, size * 1.15, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.5 * near})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  } else {
    // --- SWIPE note: rounded bar with directional arrow ---
    const barW = game.laneW * 0.72;
    const barH = 48;
    const bx = x - barW / 2;
    const by = y - barH / 2;

    // Glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, barW * 0.9);
    glow.addColorStop(0, `rgba(255,255,255,${0.5 * near})`);
    glow.addColorStop(0.4, `rgba(255,31,61,${0.55 * near})`);
    glow.addColorStop(1, 'rgba(255,31,61,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(bx - 30, by - 30, barW + 60, barH + 60);

    // Bar background
    const barGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    if (n.dir < 0) {
      barGrad.addColorStop(0, `rgba(255,31,61,${0.85 * near})`);
      barGrad.addColorStop(1, `rgba(140,15,34,${0.7 * near})`);
    } else {
      barGrad.addColorStop(0, `rgba(140,15,34,${0.7 * near})`);
      barGrad.addColorStop(1, `rgba(255,31,61,${0.85 * near})`);
    }
    ctx.fillStyle = barGrad;
    roundRect(ctx, bx, by, barW, barH, 12);
    ctx.fill();

    // Border
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * near})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Arrow
    const arrowSize = 14;
    const cx2 = x;
    const cy2 = y;
    const dir = n.dir;

    ctx.save();
    ctx.translate(cx2, cy2);
    if (dir < 0) ctx.scale(-1, 1); // flip for left

    // Arrow body
    ctx.beginPath();
    ctx.moveTo(-arrowSize * 1.6, 0);
    ctx.lineTo(-arrowSize * 0.4, -arrowSize * 0.9);
    ctx.lineTo(-arrowSize * 0.4, -arrowSize * 0.35);
    ctx.lineTo(arrowSize * 1.6, -arrowSize * 0.35);
    ctx.lineTo(arrowSize * 1.6, arrowSize * 0.35);
    ctx.lineTo(-arrowSize * 0.4, arrowSize * 0.35);
    ctx.lineTo(-arrowSize * 0.4, arrowSize * 0.9);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();

    // Direction hint text
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${0.55 * near})`;
    ctx.font = '800 9px -apple-system,Helvetica,Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(dir < 0 ? 'SWIPE LEFT' : 'SWIPE RIGHT', x, y + barH * 0.62);
    ctx.restore();
  }
}

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- start / finish ---------- */
async function startGame(song) {
  stopPreview();
  showScreen('game');
  titleWanted = false;
  if (titleAudio) fadeAudio(titleAudio, 0, 300);

  $('#ghTitle').textContent = song.title.toUpperCase();
  $('#ghScore').textContent = '0';
  $('#healthFill').style.width = '100%';
  $('#healthWrap').classList.remove('low');
  $('#resultOverlay').classList.remove('show');
  $('#ghCombo').classList.remove('show');

  if (!song.chart) {
    $('#ghTitle').textContent = 'ANALYZING…';
    await ensureAnalysis(song);
  }
  if (!song.chart || !song.chart.notes.length) {
    $('#ghTitle').textContent = 'NO DATA';
    showScreen('songs');
    return;
  }

  const cfg = DIFF_CFG[song.difficulty] || DIFF_CFG.NORMAL;

  game.song = song;
  game.notes = song.chart.notes.map(n => ({
    t: n.t, lane: n.lane, type: n.type, dir: n.dir, energy: n.energy,
    hit: false, missed: false, resolved: false
  }));
  game.approach = cfg.approach;
  game.missWindow = cfg.missWindow;
  game.score = 0;
  game.combo = 0;
  game.maxCombo = 0;
  game.health = 100;
  game.perfect = 0;
  game.great = 0;
  game.good = 0;
  game.miss = 0;
  game.particles = [];
  game.popups = [];
  game.laneFlash = [0, 0, 0, 0];
  game.padFlash = [0, 0, 0];
  game.pointers.clear();
  game.failed = false;
  game.finished = false;
  game.shakeMag = 0;

  resizeCanvas();

  const a = new Audio(song.url);
  a.volume = 0.92;
  a.preload = 'auto';
  a.crossOrigin = 'anonymous';
  game.audio = a;

  try {
    const ac = actx();
    game.audioCtx = ac;
    const src = ac.createMediaElementSource(a);
    game.analyser = ac.createAnalyser();
    game.analyser.fftSize = 256;
    game.analyser.smoothingTimeConstant = .72;
    game.freq = new Uint8Array(game.analyser.frequencyBinCount);
    src.connect(game.analyser);
    game.analyser.connect(ac.destination);
  } catch(e) {
    game.analyser = null;
    game.freq = null;
  }

  a.addEventListener('ended', () => {
    if (!game.finished) setTimeout(finishGame, 550);
  });

  // Record audio clock offsets right before playing
  try {
    await a.play();
    game.startCtxTime = actx().currentTime;
    game.startAudioTime = a.currentTime;
  } catch (e) {
    const retry = () => {
      a.play().then(() => {
        game.startCtxTime = actx().currentTime;
        game.startAudioTime = a.currentTime;
      }).catch(() => {});
      window.removeEventListener('pointerdown', retry);
    };
    window.addEventListener('pointerdown', retry);
  }

  $('#ghTitle').textContent = song.title.toUpperCase();

  game.running = true;
  game.introEnd = 2.4; // 2.4 seconds of intro time (using gameTime units)
  game.raf = requestAnimationFrame(gameLoop);
}

function finishGame() {
  if (game.finished) return;
  game.finished = true;
  game.running = false;
  cancelAnimationFrame(game.raf);

  const a = game.audio;
  if (a) {
    fadeAudio(a, 0, 900);
    setTimeout(() => { try { a.pause(); } catch (e) {} }, 950);
  }

  const total = game.perfect + game.great + game.good + game.miss;
  const weighted = game.perfect * 320 + game.great * 220 + game.good * 120;
  const maxWeighted = total * 320;
  const acc = maxWeighted > 0 ? weighted / maxWeighted : 0;

  let grade;
  if (game.failed) grade = 'F';
  else if (acc >= 0.97) grade = 'S';
  else if (acc >= 0.90) grade = 'A';
  else if (acc >= 0.80) grade = 'B';
  else if (acc >= 0.66) grade = 'C';
  else grade = 'D';

  $('#resGrade').textContent = grade;
  $('#resVerdict').textContent = game.failed ? 'Signal Lost' : (grade === 'S' ? 'Flawless' : 'Track Cleared');
  $('#resTrack').textContent = game.song ? game.song.title.toUpperCase() : '—';
  $('#resScore').textContent = game.score.toLocaleString();
  $('#resPerfect').textContent = game.perfect;
  $('#resGood').textContent = game.great + game.good;
  $('#resMiss').textContent = game.miss;
  $('#resCombo').textContent = game.maxCombo;

  $('#resultOverlay').classList.add('show');
}

function quitGame() {
  game.running = false;
  game.finished = true;
  cancelAnimationFrame(game.raf);
  if (game.audio) { try { game.audio.pause(); } catch (e) {} game.audio = null; }
  game.pointers.clear();
  $('#resultOverlay').classList.remove('show');
  showScreen('songs');
}

/* ============================================================
   UI WIRING
   ============================================================ */
$('#playBtn').addEventListener('click', () => {
  actx();
  showScreen('songs');
});

$('#backBtn').addEventListener('click', () => {
  stopPreview();
  showScreen('menu');
});

$('#quitBtn').addEventListener('click', quitGame);
$('#resBack').addEventListener('click', () => {
  $('#resultOverlay').classList.remove('show');
  showScreen('songs');
});
$('#resRetry').addEventListener('click', () => {
  $('#resultOverlay').classList.remove('show');
  if (game.song) startGame(game.song);
});

$('#importBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  files.forEach(f => {
    songs.push({
      id: 'u' + Math.random().toString(36).slice(2),
      title: prettyName(f.name),
      url: URL.createObjectURL(f),
      status: 'pending',
      duration: 0
    });
  });
  if (files.length) {
    renderSongs();
    analyzeQueue();
  }
  e.target.value = '';
});

let unlocked = false;
function unlock() {
  if (unlocked) return;
  unlocked = true;
  actx();
  tryPlayTitle();
  $('#tapHint').classList.add('hidden');
}
window.addEventListener('pointerdown', unlock, { once: false });
window.addEventListener('keydown', unlock, { once: false });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (game.running && game.audio) { try { game.audio.pause(); } catch (e) {} }
  } else {
    if (game.running && game.audio && game.audio.paused && !game.finished) {
      game.audio.play().catch(() => {});
    }
    if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  }
});

// Prevent rubber-band scrolling except on song list
document.addEventListener('touchmove', e => {
  if (e.target.closest && e.target.closest('.song-list')) return;
  e.preventDefault();
}, { passive: false });

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  buildEq();
  eqLoop();

  const icon = $('#menuIcon');
  icon.addEventListener('error', () => {
    icon.src = 'mainassets/IMG_2105.png';
    icon.classList.remove('hidden');
  });
  icon.src = 'mainassets/icon.svg';

  const bgEl = $('#menuBg');
  const testImg = new Image();
  testImg.onerror = () => { bgEl.style.backgroundImage = 'none'; };
  testImg.src = 'mainassets/IMG_2105.png';

  initTitleMusic().catch(() => {});

  const names = await listDir('music/');
  names.forEach(n => {
    songs.push({
      id: 'f' + songs.length,
      title: prettyName(n),
      url: assetUrl('music/', n),
      status: 'pending'
    });
  });

  if (!songs.length) {
    try {
      const built = await buildBuiltinSong();
      songs.push(built);
    } catch (e) {
      console.warn('built-in track failed', e);
    }
  }

  renderSongs();
  analyzeQueue();
}

boot();
})();
</script>
